<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스크래치 복권</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      overflow-x: hidden;
      color: #fff;
      -webkit-user-select: none;
      user-select: none;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(to right, #ffd700, #ffaa00, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .page-sub {
      font-size: 11px;
      color: #8888aa;
      text-align: center;
      margin-top: -8px;
    }

    /* Stats bar */
    .stats-bar {
      width: 100%;
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .stat-label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 800;
      font-family: 'Courier New', monospace;
      color: #ffd700;
    }

    .stat-value.balance { color: #ffd700; }
    .stat-value.won { color: #00ff88; }
    .stat-value.count { color: #8b8bff; }

    /* Ticket selector */
    .ticket-selector {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .ticket-type {
      flex: 1;
      padding: 10px 6px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .ticket-type:active { transform: scale(0.96); }

    .ticket-type.selected {
      border-color: #ffd700;
      background: rgba(255,215,0,0.1);
    }

    .ticket-type .t-emoji { font-size: 20px; }
    .ticket-type .t-name { font-size: 11px; color: #ccc; margin-top: 2px; }
    .ticket-type .t-price { font-size: 12px; color: #ffd700; font-weight: 700; margin-top: 2px; }

    /* Scratch card */
    .card-wrapper {
      width: 100%;
      position: relative;
    }

    .scratch-card {
      width: 100%;
      aspect-ratio: 5 / 3;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    /* Prize layer (behind canvas) */
    .prize-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 16px;
    }

    .prize-layer .prize-icon { font-size: 48px; }
    .prize-layer .prize-text {
      font-size: 22px;
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .prize-layer .prize-sub {
      font-size: 13px;
      opacity: 0.7;
    }

    /* Grade backgrounds */
    .grade-jackpot { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
    .grade-1st { background: linear-gradient(135deg, #f7971e, #ffd200); }
    .grade-2nd { background: linear-gradient(135deg, #36d1dc, #5b86e5); }
    .grade-3rd { background: linear-gradient(135deg, #56ab2f, #a8e063); }
    .grade-miss { background: linear-gradient(135deg, #4a4a6a, #2c2c44); }

    .scratch-card canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      cursor: pointer;
      touch-action: none;
    }

    /* Scratch hint */
    .scratch-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.5s;
    }

    .scratch-hint.hidden { opacity: 0; }

    .hint-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      animation: hintPulse 2s ease-in-out infinite;
    }

    .hint-icon { font-size: 32px; }
    .hint-text { font-size: 13px; color: #fff; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }

    @keyframes hintPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }

    /* Progress bar */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: -8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffaa00);
      border-radius: 3px;
      width: 0%;
      transition: width 0.2s;
    }

    .progress-text {
      font-size: 11px;
      color: #888;
      text-align: center;
      margin-top: -6px;
    }

    /* Result message */
    .result-msg {
      min-height: 32px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .result-msg.show { opacity: 1; }
    .result-msg.win { color: #ffd700; }
    .result-msg.jackpot { color: #ff4757; font-size: 20px; }
    .result-msg.miss { color: #666; }

    /* Buttons */
    .btn-row {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .new-ticket-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      color: #1a1a2e;
      box-shadow: 0 4px 15px rgba(255,215,0,0.3);
      letter-spacing: 0.5px;
    }

    .new-ticket-btn:active { transform: scale(0.97); }

    .new-ticket-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .reveal-btn {
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      color: #aaa;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .reveal-btn:active { transform: scale(0.97); }
    .reveal-btn:disabled { opacity: 0.3; cursor: default; }

    /* Prize table */
    .prize-table {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .prize-table-title {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-align: center;
    }

    .prize-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      font-size: 12px;
    }

    .prize-row + .prize-row { border-top: 1px solid rgba(255,255,255,0.04); }
    .prize-row .pr-label { color: #aaa; }
    .prize-row .pr-value { color: #ffd700; font-weight: 700; font-family: monospace; }

    /* Reset */
    .reset-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      color: #666;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .reset-btn:hover { border-color: #888; color: #aaa; }

    /* Confetti */
    .confetti-box {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      top: -10px;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to { top: 110vh; transform: rotate(720deg); }
    }

    /* Sparkle on scratch */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd700;
      pointer-events: none;
      z-index: 10;
      animation: sparkleFade 0.6s ease-out forwards;
    }

    @keyframes sparkleFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0) translate(var(--dx), var(--dy)); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="page-title">SCRATCH LOTTERY</div>
  <div class="page-sub">TRAVEL EDITION</div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-label">Balance</span>
      <span class="stat-value balance" id="balanceDisplay">10,000</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Won</span>
      <span class="stat-value won" id="wonDisplay">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Tickets</span>
      <span class="stat-value count" id="ticketCount">0</span>
    </div>
  </div>

  <!-- Ticket type selector -->
  <div class="ticket-selector">
    <div class="ticket-type selected" data-type="0" onclick="selectTicket(0)">
      <div class="t-emoji">🎫</div>
      <div class="t-name">Basic</div>
      <div class="t-price">500</div>
    </div>
    <div class="ticket-type" data-type="1" onclick="selectTicket(1)">
      <div class="t-emoji">🎟️</div>
      <div class="t-name">Silver</div>
      <div class="t-price">1,000</div>
    </div>
    <div class="ticket-type" data-type="2" onclick="selectTicket(2)">
      <div class="t-emoji">🏆</div>
      <div class="t-name">Gold</div>
      <div class="t-price">2,000</div>
    </div>
  </div>

  <!-- Scratch Card -->
  <div class="card-wrapper">
    <div class="scratch-card" id="scratchCard">
      <div class="prize-layer" id="prizeLayer">
        <div class="prize-icon" id="prizeIcon"></div>
        <div class="prize-text" id="prizeText"></div>
        <div class="prize-sub" id="prizeSub"></div>
      </div>
      <canvas id="scratchCanvas"></canvas>
      <div class="scratch-hint" id="scratchHint">
        <div class="hint-content">
          <span class="hint-icon">👆</span>
          <span class="hint-text">긁어서 확인하세요!</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">복권을 구매하세요</div>

  <!-- Result -->
  <div class="result-msg" id="resultMsg"></div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="new-ticket-btn" id="buyBtn" onclick="buyTicket()">새 복권 구매</button>
    <button class="reveal-btn" id="revealBtn" onclick="revealAll()" disabled>전체 공개</button>
  </div>

  <!-- Prize table -->
  <div class="prize-table" id="prizeTableContainer"></div>

  <button class="reset-btn" onclick="resetAll()">잔액 초기화</button>
</div>

<div class="confetti-box" id="confettiBox"></div>

<script>
  // ── Ticket configurations ──
  const TICKETS = [
    {
      name: 'Basic', price: 500,
      prizes: [
        { grade: 'jackpot', label: '🎉 JACKPOT!', icon: '💎', text: '50,000', value: 50000, prob: 0.5 },
        { grade: '1st',     label: '1등', icon: '🗼', text: '5,000',  value: 5000,  prob: 2 },
        { grade: '2nd',     label: '2등', icon: '🎡', text: '2,000',  value: 2000,  prob: 5 },
        { grade: '3rd',     label: '3등', icon: '✈️', text: '1,000',  value: 1000,  prob: 12 },
        { grade: 'miss',    label: '꽝', icon: '💨', text: '다음 기회에', value: 0, prob: 80.5 }
      ]
    },
    {
      name: 'Silver', price: 1000,
      prizes: [
        { grade: 'jackpot', label: '🎉 JACKPOT!', icon: '💎', text: '100,000', value: 100000, prob: 0.5 },
        { grade: '1st',     label: '1등', icon: '🏰', text: '10,000', value: 10000, prob: 2.5 },
        { grade: '2nd',     label: '2등', icon: '🗽', text: '4,000',  value: 4000,  prob: 6 },
        { grade: '3rd',     label: '3등', icon: '🎢', text: '2,000',  value: 2000,  prob: 14 },
        { grade: 'miss',    label: '꽝', icon: '💨', text: '다음 기회에', value: 0, prob: 77 }
      ]
    },
    {
      name: 'Gold', price: 2000,
      prizes: [
        { grade: 'jackpot', label: '🎉 JACKPOT!', icon: '💎', text: '200,000', value: 200000, prob: 0.8 },
        { grade: '1st',     label: '1등', icon: '🏯', text: '20,000', value: 20000, prob: 3 },
        { grade: '2nd',     label: '2등', icon: '🌴', text: '8,000',  value: 8000,  prob: 7 },
        { grade: '3rd',     label: '3등', icon: '🚢', text: '4,000',  value: 4000,  prob: 15 },
        { grade: 'miss',    label: '꽝', icon: '💨', text: '다음 기회에', value: 0, prob: 74.2 }
      ]
    }
  ];

  // ── State ──
  let balance = parseInt(localStorage.getItem('scratch_balance')) || 10000;
  let totalWon = parseInt(localStorage.getItem('scratch_won')) || 0;
  let ticketsUsed = parseInt(localStorage.getItem('scratch_tickets')) || 0;
  let selectedType = 0;
  let currentPrize = null;
  let hasTicket = false;
  let isRevealed = false;
  let scratchStarted = false;

  // ── DOM ──
  const canvas = document.getElementById('scratchCanvas');
  const ctx = canvas.getContext('2d');
  const prizeLayer = document.getElementById('prizeLayer');
  const prizeIcon = document.getElementById('prizeIcon');
  const prizeText = document.getElementById('prizeText');
  const prizeSub = document.getElementById('prizeSub');
  const scratchHint = document.getElementById('scratchHint');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const resultMsg = document.getElementById('resultMsg');
  const buyBtn = document.getElementById('buyBtn');
  const revealBtn = document.getElementById('revealBtn');
  const confettiBox = document.getElementById('confettiBox');

  // ── Init ──
  updateDisplay();
  renderPrizeTable();
  resetCard();

  // ── Ticket selection ──
  function selectTicket(type) {
    if (hasTicket && !isRevealed) return;
    selectedType = type;
    document.querySelectorAll('.ticket-type').forEach((el, i) => {
      el.classList.toggle('selected', i === type);
    });
    renderPrizeTable();
  }

  function renderPrizeTable() {
    const t = TICKETS[selectedType];
    const container = document.getElementById('prizeTableContainer');
    let html = `<div class="prize-table-title">${t.name} Ticket - Prize Table</div>`;
    t.prizes.forEach(p => {
      if (p.grade === 'miss') return;
      html += `<div class="prize-row">
        <span class="pr-label">${p.icon} ${p.label}</span>
        <span class="pr-value">${p.text}</span>
      </div>`;
    });
    container.innerHTML = html;
  }

  // ── Buy ticket ──
  function buyTicket() {
    const ticket = TICKETS[selectedType];
    if (balance < ticket.price) {
      showResult('잔액이 부족합니다!', 'miss');
      return;
    }

    balance -= ticket.price;
    ticketsUsed++;
    saveState();
    updateDisplay();

    // Determine prize
    currentPrize = rollPrize(ticket.prizes);
    hasTicket = true;
    isRevealed = false;
    scratchStarted = false;

    // Setup card
    setupPrizeLayer();
    initCanvasCover();

    scratchHint.classList.remove('hidden');
    progressFill.style.width = '0%';
    progressText.textContent = '긁어서 확인하세요!';
    resultMsg.classList.remove('show');
    resultMsg.textContent = '';

    buyBtn.disabled = true;
    revealBtn.disabled = false;
  }

  function rollPrize(prizes) {
    const rand = Math.random() * 100;
    let cumulative = 0;
    for (const p of prizes) {
      cumulative += p.prob;
      if (rand < cumulative) return p;
    }
    return prizes[prizes.length - 1];
  }

  // ── Prize layer setup ──
  function setupPrizeLayer() {
    prizeLayer.className = 'prize-layer grade-' + currentPrize.grade;
    prizeIcon.textContent = currentPrize.icon;
    prizeText.textContent = currentPrize.grade === 'miss' ? currentPrize.text : `+${currentPrize.text}`;
    prizeSub.textContent = currentPrize.label;
  }

  // ── Canvas scratch cover ──
  function initCanvasCover() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Draw scratch cover with pattern
    const w = rect.width;
    const h = rect.height;

    // Base gradient
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, '#8e9aaf');
    grad.addColorStop(0.5, '#a8b5c8');
    grad.addColorStop(1, '#8e9aaf');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Diagonal stripe pattern
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let i = -h; i < w + h; i += 12) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i + h, h);
      ctx.stroke();
    }

    // Border shine
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(1, 1, w - 2, h - 2, 16);
    ctx.stroke();

    // Text
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = 'bold 16px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SCRATCH HERE', w / 2, h / 2 - 10);
    ctx.font = '12px -apple-system, sans-serif';
    ctx.fillText('긁어서 확인하세요', w / 2, h / 2 + 12);

    // Coin icon circles as decoration
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    for (let i = 0; i < 8; i++) {
      const cx = Math.random() * w;
      const cy = Math.random() * h;
      const r = 10 + Math.random() * 20;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'destination-out';
  }

  // ── Scratch drawing (mouse + touch) ──
  let isDrawing = false;
  let lastX = 0, lastY = 0;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDraw(e) {
    if (!hasTicket || isRevealed) return;
    e.preventDefault();
    isDrawing = true;
    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;

    if (!scratchStarted) {
      scratchStarted = true;
      scratchHint.classList.add('hidden');
    }
  }

  function moveDraw(e) {
    if (!isDrawing || !hasTicket || isRevealed) return;
    e.preventDefault();
    const pos = getPos(e);

    ctx.lineWidth = 36;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();

    // Sparkle effect
    if (Math.random() < 0.3) {
      createSparkle(pos.x, pos.y);
    }

    lastX = pos.x;
    lastY = pos.y;

    checkScratchProgress();
  }

  function endDraw(e) {
    if (e) e.preventDefault();
    isDrawing = false;
  }

  // Mouse events
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);

  // Touch events
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', moveDraw, { passive: false });
  canvas.addEventListener('touchend', endDraw, { passive: false });
  canvas.addEventListener('touchcancel', endDraw, { passive: false });

  // ── Check scratch percentage ──
  function checkScratchProgress() {
    const dpr = window.devicePixelRatio || 1;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const pixels = imageData.data;
    let cleared = 0;
    const total = pixels.length / 4;

    for (let i = 3; i < pixels.length; i += 16) { // sample every 4th pixel for performance
      if (pixels[i] === 0) cleared++;
    }

    const sampleTotal = Math.ceil(total / 4);
    const percent = Math.round((cleared / sampleTotal) * 100);

    progressFill.style.width = Math.min(percent, 100) + '%';
    progressText.textContent = `${Math.min(percent, 100)}% 긁음`;

    if (percent >= 60 && !isRevealed) {
      revealAll();
    }
  }

  // ── Reveal all ──
  function revealAll() {
    if (!hasTicket || isRevealed) return;
    isRevealed = true;

    // Fade out canvas
    canvas.style.transition = 'opacity 0.5s';
    canvas.style.opacity = '0';

    scratchHint.classList.add('hidden');
    progressFill.style.width = '100%';
    progressText.textContent = '100% 공개!';

    revealBtn.disabled = true;
    buyBtn.disabled = false;

    // Award prize
    if (currentPrize.value > 0) {
      balance += currentPrize.value;
      totalWon += currentPrize.value;
      saveState();
      updateDisplay();

      if (currentPrize.grade === 'jackpot') {
        showResult(`🎉 JACKPOT! +${currentPrize.text} 🎉`, 'jackpot');
        fireConfetti(50);
      } else {
        showResult(`${currentPrize.icon} ${currentPrize.label} 당첨! +${currentPrize.text}`, 'win');
        if (currentPrize.grade === '1st') fireConfetti(30);
        else if (currentPrize.grade === '2nd') fireConfetti(15);
      }
    } else {
      showResult('💨 꽝! 다음 기회에 도전하세요', 'miss');
    }
  }

  // ── Reset card visual ──
  function resetCard() {
    canvas.style.transition = 'none';
    canvas.style.opacity = '1';
    ctx.globalCompositeOperation = 'source-over';

    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Empty state
    ctx.fillStyle = '#3a3a5a';
    ctx.fillRect(0, 0, rect.width, rect.height);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = 'bold 14px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('복권을 구매하세요', rect.width / 2, rect.height / 2);

    prizeLayer.className = 'prize-layer grade-miss';
    prizeIcon.textContent = '';
    prizeText.textContent = '';
    prizeSub.textContent = '';
    scratchHint.classList.add('hidden');

    hasTicket = false;
    isRevealed = false;
    currentPrize = null;
    buyBtn.disabled = false;
    revealBtn.disabled = true;
  }

  // ── Sparkle effect ──
  function createSparkle(x, y) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    const dx = (Math.random() - 0.5) * 30;
    const dy = (Math.random() - 0.5) * 30;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.setProperty('--dx', dx + 'px');
    el.style.setProperty('--dy', dy + 'px');
    el.style.background = ['#ffd700', '#fff', '#ffaa00', '#ff6b81'][Math.floor(Math.random() * 4)];
    canvas.parentElement.appendChild(el);
    setTimeout(() => el.remove(), 600);
  }

  // ── UI helpers ──
  function showResult(text, type) {
    resultMsg.textContent = text;
    resultMsg.className = 'result-msg show ' + type;
  }

  function updateDisplay() {
    document.getElementById('balanceDisplay').textContent = balance.toLocaleString();
    document.getElementById('wonDisplay').textContent = totalWon.toLocaleString();
    document.getElementById('ticketCount').textContent = ticketsUsed;
  }

  function saveState() {
    localStorage.setItem('scratch_balance', balance);
    localStorage.setItem('scratch_won', totalWon);
    localStorage.setItem('scratch_tickets', ticketsUsed);
  }

  function resetAll() {
    balance = 10000;
    totalWon = 0;
    ticketsUsed = 0;
    saveState();
    updateDisplay();
    resetCard();
    progressFill.style.width = '0%';
    progressText.textContent = '복권을 구매하세요';
    resultMsg.classList.remove('show');
  }

  // ── Confetti ──
  function fireConfetti(count) {
    const colors = ['#ffd700', '#ff4757', '#00ff88', '#3b82f6', '#ff6b81', '#a855f7', '#06d6a0'];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + '%';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      el.style.width = (4 + Math.random() * 6) + 'px';
      el.style.height = (4 + Math.random() * 6) + 'px';
      el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      el.style.animationDelay = (Math.random() * 0.5) + 's';
      confettiBox.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }

  // ── Handle resize ──
  window.addEventListener('resize', () => {
    if (!hasTicket) {
      resetCard();
    }
  });
</script>

</body>
</html>
