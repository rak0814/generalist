<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채팅</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 공통 헤더 ── */
    .chat-header {
      background: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    .chat-header h2 {
      font-size: 17px;
      font-weight: 700;
      color: #111;
      flex: 1;
    }

    .header-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn {
      background: none;
      font-size: 22px;
      width: auto;
      padding: 0;
    }

    /* ── 채팅 목록 ── */
    .chat-list-view { display: flex; flex-direction: column; height: 100vh; }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .chat-item:active { background: #f0f0f0; }

    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-info .name {
      font-size: 15px;
      font-weight: 600;
      color: #111;
      margin-bottom: 2px;
    }

    .chat-info .preview {
      font-size: 13px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .chat-meta .time {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .unread-badge {
      background: #f43f5e;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      display: inline-block;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #bbb;
      font-size: 14px;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    /* ── 채팅방 ── */
    .chat-room-view {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 80%;
    }

    .msg-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-row.received {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-row.sent .msg-bubble {
      background: #6366f1;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.received .msg-bubble {
      background: #fff;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: #bbb;
      flex-shrink: 0;
    }

    .msg-date-divider {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      padding: 12px 0;
    }

    /* ── 입력창 ── */
    .input-bar {
      padding: 10px 12px 28px;
      background: #fff;
      border-top: 1px solid #eee;
      flex-shrink: 0;
    }

    .input-bar:focus-within { padding-bottom: 10px; }

    .input-wrap {
      display: flex;
      align-items: center;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      background: #fafafa;
      padding-right: 4px;
    }

    .input-wrap:focus-within {
      border-color: #ccc;
      background: #fff;
    }

    .input-bar input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      font-size: 14px;
      outline: none;
      background: transparent;
      border-radius: 24px 0 0 24px;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: #6366f1;
      color: #fff;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── 새 채팅 모달 ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
    }

    .modal-box h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search-row input {
      flex: 1;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .search-row input:focus { border-color: #6366f1; }

    .search-row button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-result {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      min-height: 20px;
    }

    .search-result.found {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      font-size: 13px;
    }

    .search-result.not-found {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-cancel { background: #f0f0f0; color: #333; }
    .modal-start { background: #6366f1; color: #fff; }
    .modal-start:disabled { opacity: 0.4; cursor: not-allowed; }

    .hidden { display: none !important; }

    /* 로그인 안내 */
    .login-prompt {
      text-align: center;
      padding: 80px 20px;
    }

    .login-prompt .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
    .login-prompt p { color: #888; font-size: 14px; margin-bottom: 16px; }

    .login-prompt button {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- ── 채팅 목록 화면 ── -->
<div class="chat-list-view" id="chatListView">
  <div class="chat-header">
    <h2>채팅</h2>
    <button class="header-btn" id="newChatBtn" onclick="showNewChatModal()" title="새 채팅">&#43;</button>
  </div>

  <div id="loginPrompt" class="login-prompt hidden">
    <div class="icon">&#128172;</div>
    <p>로그인 후 이용할 수 있습니다</p>
    <button onclick="goToAuth()">로그인</button>
  </div>

  <div class="chat-list" id="chatList">
    <div class="empty-state" id="emptyState">
      <div class="icon">&#128172;</div>
      <p>채팅이 없습니다<br>+ 버튼으로 새 채팅을 시작하세요</p>
    </div>
  </div>
</div>

<!-- ── 채팅방 화면 ── -->
<div class="chat-room-view" id="chatRoomView">
  <div class="chat-header">
    <button class="header-btn back-btn" onclick="goBack()">&#8249;</button>
    <h2 id="roomName">상대방</h2>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-bar">
    <div class="input-wrap">
      <input type="text" id="msgInput" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="send-btn" onmousedown="event.preventDefault()" onclick="sendMessage()">&#10148;</button>
    </div>
  </div>
</div>

<!-- ── 새 채팅 모달 ── -->
<div class="modal-overlay hidden" id="newChatModal">
  <div class="modal-box">
    <h3>새 채팅</h3>
    <div class="search-row">
      <input type="email" id="searchEmail" placeholder="상대방 이메일 입력">
      <button onclick="searchUser()">검색</button>
    </div>
    <div class="search-result hidden" id="searchResult"></div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="hideNewChatModal()">취소</button>
      <button class="modal-start" id="startChatBtn" onclick="startChat()" disabled>채팅 시작</button>
    </div>
  </div>
</div>

<script>
  let sb = null;
  let currentUser = null;
  let currentConvId = null;
  let currentChannel = null;
  let foundUser = null;
  let currentRoomName = '';

  // ── 초기화 ──
  async function init() {
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await sb.auth.getSession();

      if (session?.user) {
        currentUser = session.user;
        document.getElementById('loginPrompt').classList.add('hidden');
        document.getElementById('newChatBtn').style.display = 'flex';
        loadConversations();
        subscribeToNewMessages();
      } else {
        document.getElementById('loginPrompt').classList.remove('hidden');
        document.getElementById('emptyState').classList.add('hidden');
        document.getElementById('newChatBtn').style.display = 'none';
      }
    } catch (err) {
      console.error('초기화 실패:', err);
    }
  }

  function goToAuth() {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'go-to-auth' }, '*');
    }
  }

  // ── 대화 목록 로드 ──
  async function loadConversations() {
    if (!sb || !currentUser) return;

    const { data, error } = await sb
      .from('conversations')
      .select('*')
      .or(`user1_id.eq.${currentUser.id},user2_id.eq.${currentUser.id}`)
      .order('last_message_at', { ascending: false, nullsFirst: false });

    if (error || !data || data.length === 0) {
      document.getElementById('emptyState').classList.remove('hidden');
      return;
    }

    document.getElementById('emptyState').classList.add('hidden');

    // 읽지 않은 메시지 수 조회
    const convIds = data.map(c => c.id);
    const { data: unreadData } = await sb
      .from('messages')
      .select('conversation_id')
      .in('conversation_id', convIds)
      .neq('sender_id', currentUser.id)
      .eq('is_read', false);

    const unreadMap = {};
    if (unreadData) {
      unreadData.forEach(m => {
        unreadMap[m.conversation_id] = (unreadMap[m.conversation_id] || 0) + 1;
      });
    }

    const listEl = document.getElementById('chatList');
    listEl.innerHTML = data.map(conv => {
      const isUser1 = conv.user1_id === currentUser.id;
      const otherName = isUser1 ? conv.user2_nickname : conv.user1_nickname;
      const initial = otherName ? otherName.charAt(0).toUpperCase() : '?';
      const preview = conv.last_message || '새 대화';
      const time = conv.last_message_at ? formatTime(conv.last_message_at) : '';
      const unread = unreadMap[conv.id] || 0;
      const unreadHtml = unread > 0 ? `<span class="unread-badge">${unread}</span>` : '';

      return `
        <div class="chat-item" onclick="openRoom('${conv.id}', '${escapeHtml(otherName)}')">
          <div class="chat-avatar">${initial}</div>
          <div class="chat-info">
            <p class="name">${escapeHtml(otherName)}</p>
            <p class="preview">${escapeHtml(preview)}</p>
          </div>
          <div class="chat-meta">
            <p class="time">${time}</p>
            ${unreadHtml}
          </div>
        </div>`;
    }).join('');
  }

  // ── 채팅방 열기 ──
  async function openRoom(convId, name) {
    currentConvId = convId;
    currentRoomName = name;
    document.getElementById('roomName').textContent = name;
    document.getElementById('chatListView').style.display = 'none';
    document.getElementById('chatRoomView').style.display = 'flex';
    history.pushState({ room: convId }, '', '');

    await loadMessages();
    await markAsRead();
    subscribeToMessages();

  }

  function goBack() {
    document.getElementById('chatRoomView').style.display = 'none';
    document.getElementById('chatListView').style.display = 'flex';
    currentConvId = null;

    if (currentChannel) {
      sb.removeChannel(currentChannel);
      currentChannel = null;
    }

    loadConversations();
  }

  window.addEventListener('popstate', function() {
    if (currentConvId) {
      goBack();
    }
  });

  // ── 메시지 로드 ──
  async function loadMessages() {
    if (!sb || !currentConvId) return;

    const { data, error } = await sb
      .from('messages')
      .select('*')
      .eq('conversation_id', currentConvId)
      .order('created_at', { ascending: true });

    const el = document.getElementById('messages');
    if (!data || data.length === 0) {
      el.innerHTML = '<p style="text-align:center;color:#bbb;padding:40px;font-size:13px;">첫 메시지를 보내보세요</p>';
      return;
    }

    let html = '';
    let lastDate = '';

    data.forEach(msg => {
      const date = new Date(msg.created_at).toLocaleDateString('ko-KR');
      if (date !== lastDate) {
        html += `<div class="msg-date-divider">${date}</div>`;
        lastDate = date;
      }

      const isSent = msg.sender_id === currentUser.id;
      const time = new Date(msg.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      const avatar = !isSent ? `<div class="msg-avatar">${currentRoomName.charAt(0).toUpperCase()}</div>` : '';

      html += `
        <div class="msg-row ${isSent ? 'sent' : 'received'}">
          ${avatar}
          <div class="msg-bubble">${escapeHtml(msg.content)}</div>
          <span class="msg-time">${time}</span>
        </div>`;
    });

    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
  }

  // ── 메시지 전송 ──
  async function sendMessage() {
    if (!sb || !currentUser || !currentConvId) return;

    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content) return;

    input.value = '';

    const nickname = currentUser.user_metadata?.nickname || currentUser.email.split('@')[0];

    await sb.from('messages').insert({
      conversation_id: currentConvId,
      sender_id: currentUser.id,
      sender_nickname: nickname,
      content: content
    });

    // 대화 목록의 마지막 메시지 업데이트
    await sb.from('conversations').update({
      last_message: content,
      last_message_at: new Date().toISOString()
    }).eq('id', currentConvId);
  }

  // ── 실시간 구독 ──
  function subscribeToMessages() {
    if (currentChannel) {
      sb.removeChannel(currentChannel);
    }

    currentChannel = sb
      .channel('room-' + currentConvId)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'messages',
        filter: `conversation_id=eq.${currentConvId}`
      }, (payload) => {
        const msg = payload.new;
        const isSent = msg.sender_id === currentUser.id;
        const time = new Date(msg.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        const el = document.getElementById('messages');

        // "첫 메시지" 안내 제거
        const placeholder = el.querySelector('p');
        if (placeholder && placeholder.style.textAlign === 'center') {
          placeholder.remove();
        }

        const avatar = !isSent ? `<div class="msg-avatar">${currentRoomName.charAt(0).toUpperCase()}</div>` : '';
        const div = document.createElement('div');
        div.className = `msg-row ${isSent ? 'sent' : 'received'}`;
        div.innerHTML = `
          ${avatar}
          <div class="msg-bubble">${escapeHtml(msg.content)}</div>
          <span class="msg-time">${time}</span>`;
        el.appendChild(div);
        el.scrollTop = el.scrollHeight;

        // 받은 메시지 읽음 처리
        if (!isSent) {
          sb.from('messages').update({ is_read: true }).eq('id', msg.id).then();
        }
      })
      .subscribe();
  }

  // ── 채팅 목록 실시간 갱신 (notifications 구독) ──
  function subscribeToNewMessages() {
    sb.channel('chat-noti-' + currentUser.id)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'notifications',
        filter: `user_id=eq.${currentUser.id}`
      }, (payload) => {
        if (payload.new.type === 'message' && !currentConvId) {
          loadConversations();
        }
      })
      .subscribe();
  }

  // ── 읽음 처리 ──
  async function markAsRead() {
    if (!sb || !currentUser || !currentConvId) return;
    await sb.from('messages')
      .update({ is_read: true })
      .eq('conversation_id', currentConvId)
      .neq('sender_id', currentUser.id)
      .eq('is_read', false);
  }

  // ── 새 채팅 모달 ──
  function showNewChatModal() {
    foundUser = null;
    document.getElementById('searchEmail').value = '';
    document.getElementById('searchResult').classList.add('hidden');
    document.getElementById('startChatBtn').disabled = true;
    document.getElementById('newChatModal').classList.remove('hidden');
  }

  function hideNewChatModal() {
    document.getElementById('newChatModal').classList.add('hidden');
  }

  async function searchUser() {
    if (!sb) return;
    const email = document.getElementById('searchEmail').value.trim();
    if (!email) return;

    if (email === currentUser.email) {
      showSearchResult('자기 자신에게는 채팅을 보낼 수 없습니다.', false);
      return;
    }

    // posts 또는 comments에서 해당 이메일의 유저 검색
    const { data } = await sb
      .from('posts')
      .select('user_id, user_email, user_nickname')
      .eq('user_email', email)
      .limit(1);

    if (data && data.length > 0) {
      foundUser = data[0];
      showSearchResult(`${foundUser.user_nickname} (${foundUser.user_email})`, true);
      document.getElementById('startChatBtn').disabled = false;
    } else {
      // comments에서도 검색
      const { data: cData } = await sb
        .from('comments')
        .select('user_id, user_email, user_nickname')
        .eq('user_email', email)
        .limit(1);

      if (cData && cData.length > 0) {
        foundUser = cData[0];
        showSearchResult(`${foundUser.user_nickname} (${foundUser.user_email})`, true);
        document.getElementById('startChatBtn').disabled = false;
      } else {
        foundUser = null;
        showSearchResult('해당 이메일의 사용자를 찾을 수 없습니다.', false);
        document.getElementById('startChatBtn').disabled = true;
      }
    }
  }

  function showSearchResult(text, success) {
    const el = document.getElementById('searchResult');
    el.textContent = text;
    el.className = 'search-result ' + (success ? 'found' : 'not-found');
    el.classList.remove('hidden');
  }

  async function startChat() {
    if (!sb || !currentUser || !foundUser) return;

    const myId = currentUser.id;
    const otherId = foundUser.user_id;
    const myNickname = currentUser.user_metadata?.nickname || currentUser.email.split('@')[0];
    const otherNickname = foundUser.user_nickname;

    // 기존 대화 확인
    const { data: existing } = await sb
      .from('conversations')
      .select('id')
      .or(`and(user1_id.eq.${myId},user2_id.eq.${otherId}),and(user1_id.eq.${otherId},user2_id.eq.${myId})`)
      .limit(1);

    let convId;
    if (existing && existing.length > 0) {
      convId = existing[0].id;
    } else {
      const { data: newConv, error } = await sb
        .from('conversations')
        .insert({
          user1_id: myId,
          user1_nickname: myNickname,
          user2_id: otherId,
          user2_nickname: otherNickname
        })
        .select()
        .single();

      if (error) {
        alert('채팅 생성 실패: ' + error.message);
        return;
      }
      convId = newConv.id;
    }

    hideNewChatModal();
    openRoom(convId, otherNickname);
  }

  // ── 유틸 ──
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatTime(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();

    if (isToday) {
      return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) {
      return '어제';
    }

    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  init();
</script>
