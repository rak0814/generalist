<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 / 회원가입</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 400px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-header .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
    }

    .auth-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .auth-header p {
      font-size: 13px;
      color: #888;
    }

    .auth-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .tab-bar {
      display: flex;
      background: #f0f0f0;
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #fff;
      color: #111;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background: #fafafa;
    }

    .form-group input:focus {
      border-color: #6366f1;
      background: #fff;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .link-btn {
      background: none;
      border: none;
      color: #6366f1;
      font-size: 13px;
      cursor: pointer;
      margin-top: 12px;
      display: block;
      text-align: center;
      width: 100%;
    }

    .link-btn:hover { text-decoration: underline; }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    /* Profile card */
    .profile-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      text-align: center;
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      margin-bottom: 16px;
    }

    .profile-nickname {
      font-size: 18px;
      font-weight: 700;
      color: #111;
      margin-bottom: 2px;
    }

    .profile-email {
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
      word-break: break-all;
    }

    .profile-date {
      font-size: 12px;
      color: #bbb;
      margin-bottom: 24px;
    }

    .profile-edit-section {
      text-align: left;
      border-top: 1px solid #eee;
      padding-top: 20px;
      margin-top: 4px;
    }

    .profile-edit-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .profile-edit-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .profile-edit-row button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      height: 44px;
    }

    .profile-msg {
      font-size: 12px;
      margin-top: 8px;
      color: #059669;
      display: none;
    }

    .hidden { display: none !important; }

    /* 약관 동의 */
    .agree-section {
      margin-bottom: 16px;
    }

    .agree-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .agree-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .agree-row label {
      font-size: 12px;
      color: #555;
      cursor: pointer;
      line-height: 1.4;
    }

    .agree-row a {
      color: #6366f1;
      text-decoration: underline;
    }

    /* 비밀번호 변경 */
    .pw-change-section {
      border-top: 1px solid #eee;
      padding-top: 20px;
      margin-top: 20px;
      text-align: left;
    }

    .pw-change-section label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    .pw-change-section .form-group {
      margin-bottom: 12px;
    }

    .pw-change-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .pw-change-btn:hover { opacity: 0.9; }
    .pw-change-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .pw-msg {
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    /* 회원탈퇴 */
    .danger-section {
      border-top: 1px solid #fee2e2;
      padding-top: 20px;
      margin-top: 20px;
    }

    .delete-account-btn {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #fca5a5;
      border-radius: 10px;
      background: #fff;
      color: #dc2626;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delete-account-btn:hover {
      background: #fef2f2;
      border-color: #f87171;
    }

    /* 확인 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }

    .modal-box h3 {
      font-size: 17px;
      font-weight: 700;
      color: #dc2626;
      margin-bottom: 8px;
    }

    .modal-box p {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .modal-cancel {
      background: #f0f0f0;
      color: #333;
    }

    .modal-confirm {
      background: #dc2626;
      color: #fff;
    }

    .modal-confirm:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .modal-actions button:hover:not(:disabled) { opacity: 0.85; }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-header">
    <div class="logo">G</div>
    <h1>Generalist</h1>
    <p id="authSubtitle">이메일로 간편하게 시작하세요</p>
  </div>

  <!-- Login / Signup Form -->
  <div class="auth-card" id="authCard">
    <div class="tab-bar" id="tabBar">
      <button type="button" class="tab-btn active" id="tabLogin" onclick="switchTab('login')">로그인</button>
      <button type="button" class="tab-btn" id="tabSignup" onclick="switchTab('signup')">회원가입</button>
    </div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="form-group" id="nicknameGroup" style="display:none;">
        <label>닉네임</label>
        <input type="text" id="nickname" placeholder="닉네임을 입력하세요" autocomplete="name">
      </div>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="email" placeholder="example@email.com" required autocomplete="email">
      </div>
      <div class="form-group" id="passwordGroup">
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="6자 이상 입력하세요" required minlength="6" autocomplete="current-password">
      </div>
      <div class="form-group hidden" id="confirmGroup">
        <label>비밀번호 확인</label>
        <input type="password" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password">
      </div>
      <div class="agree-section hidden" id="agreeSection">
        <div class="agree-row">
          <input type="checkbox" id="agreeTerms">
          <label for="agreeTerms"><a href="../legal/terms.html" target="_blank">이용약관</a>에 동의합니다 (필수)</label>
        </div>
        <div class="agree-row">
          <input type="checkbox" id="agreePrivacy">
          <label for="agreePrivacy"><a href="../legal/privacy.html" target="_blank">개인정보처리방침</a>에 동의합니다 (필수)</label>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">로그인</button>
    </form>

    <button type="button" class="link-btn" id="forgotBtn" onclick="switchTab('forgot')">비밀번호를 잊으셨나요?</button>

    <div class="message" id="message"></div>
  </div>

  <!-- Profile (logged-in) -->
  <div class="profile-card hidden" id="profileCard">
    <div class="profile-avatar" id="profileAvatar">&#128100;</div>
    <p class="profile-nickname" id="profileNickname"></p>
    <p class="profile-email" id="profileEmail"></p>
    <p class="profile-date" id="profileDate"></p>

    <div class="profile-edit-section">
      <div class="profile-edit-row">
        <div class="form-group">
          <label>닉네임 변경</label>
          <input type="text" id="editNickname" placeholder="새 닉네임">
        </div>
        <button onclick="updateNickname()">변경</button>
      </div>
      <p class="profile-msg" id="profileMsg"></p>
    </div>

    <div class="pw-change-section">
      <label style="display:block;font-size:13px;font-weight:600;color:#333;margin-bottom:10px;">비밀번호 변경</label>
      <div class="form-group">
        <input type="password" id="currentPw" placeholder="현재 비밀번호">
      </div>
      <div class="form-group">
        <input type="password" id="newPw" placeholder="새 비밀번호 (6자 이상)" minlength="6">
      </div>
      <div class="form-group">
        <input type="password" id="confirmNewPw" placeholder="새 비밀번호 확인">
      </div>
      <button class="pw-change-btn" onclick="changePassword()">변경</button>
      <p class="pw-msg" id="pwMsg"></p>
    </div>

    <div class="danger-section">
      <button class="delete-account-btn" onclick="showDeleteModal()">회원탈퇴</button>
    </div>
  </div>

  <!-- 회원탈퇴 확인 모달 -->
  <div class="modal-overlay hidden" id="deleteModal">
    <div class="modal-box">
      <h3>회원탈퇴</h3>
      <p>탈퇴하면 모든 데이터가 삭제되며 복구할 수 없습니다. 계속하려면 비밀번호를 입력하세요.</p>
      <div class="form-group">
        <label>비밀번호 확인</label>
        <input type="password" id="deletePassword" placeholder="비밀번호를 입력하세요">
      </div>
      <div class="modal-actions">
        <button class="modal-cancel" onclick="hideDeleteModal()">취소</button>
        <button class="modal-confirm" id="deleteConfirmBtn" onclick="handleDeleteAccount()">탈퇴하기</button>
      </div>
      <div class="message" id="deleteMessage"></div>
    </div>
  </div>
</div>

<script>
  let currentTab = 'login';
  let sb = null;

  // ── UI 함수 ──
  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('authForm').reset();
    hideMessage();

    if (tab === 'forgot') {
      document.getElementById('tabBar').style.display = 'none';
      document.getElementById('passwordGroup').style.display = 'none';
      document.getElementById('confirmGroup').classList.add('hidden');
      document.getElementById('nicknameGroup').style.display = 'none';
      document.getElementById('agreeSection').classList.add('hidden');
      document.getElementById('submitBtn').textContent = '비밀번호 재설정 메일 보내기';
      document.getElementById('forgotBtn').textContent = '로그인으로 돌아가기';
      document.getElementById('forgotBtn').onclick = function() { switchTab('login'); };
      document.getElementById('password').removeAttribute('required');
      document.getElementById('authSubtitle').textContent = '가입한 이메일을 입력하세요';
    } else {
      document.getElementById('tabBar').style.display = 'flex';
      document.getElementById('passwordGroup').style.display = 'block';
      document.getElementById('password').setAttribute('required', '');
      document.getElementById('forgotBtn').textContent = '비밀번호를 잊으셨나요?';
      document.getElementById('forgotBtn').onclick = function() { switchTab('forgot'); };
      document.getElementById('forgotBtn').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('authSubtitle').textContent = '이메일로 간편하게 시작하세요';

      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
      document.getElementById('confirmGroup').classList.toggle('hidden', tab === 'login');
      document.getElementById('nicknameGroup').style.display = tab === 'signup' ? 'block' : 'none';
      document.getElementById('agreeSection').classList.toggle('hidden', tab !== 'signup');
      document.getElementById('submitBtn').textContent = tab === 'login' ? '로그인' : '회원가입';
    }
  }

  function showMessage(text, type) {
    const el = document.getElementById('message');
    el.innerHTML = text.replace(/\n/g, '<br>');
    el.className = 'message ' + type;
    el.style.display = 'block';
  }

  function hideMessage() {
    const el = document.getElementById('message');
    el.className = 'message';
    el.style.display = 'none';
  }

  function showLoggedIn(user) {
    document.getElementById('authCard').classList.add('hidden');
    document.getElementById('profileCard').classList.remove('hidden');
    document.querySelector('.auth-header').style.display = 'none';

    const nickname = user.user_metadata?.nickname || user.email.split('@')[0];
    document.getElementById('profileAvatar').textContent = nickname.charAt(0).toUpperCase();
    document.getElementById('profileNickname').textContent = nickname;
    document.getElementById('profileEmail').textContent = user.email;
    document.getElementById('editNickname').value = nickname;

    const created = new Date(user.created_at);
    document.getElementById('profileDate').textContent =
      '가입일: ' + created.getFullYear() + '.' + (created.getMonth()+1) + '.' + created.getDate();
  }

  function notifyParent(user, action) {
    if (window.parent !== window) {
      window.parent.postMessage({
        type: 'auth-state-change',
        action: action || 'init',
        user: user ? { email: user.email, id: user.id, nickname: user.user_metadata?.nickname } : null
      }, '*');
    }
  }

  // ── Form submit ──
  async function handleSubmit(e) {
    e.preventDefault();
    if (!sb) { showMessage('서버 연결 중입니다. 잠시 후 다시 시도하세요.', 'error'); return; }

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    try {
      if (currentTab === 'forgot') {
        const redirectUrl = window.location.origin + '/auth/reset-password.html';
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl });
        if (error) {
          showMessage(error.message, 'error');
        } else {
          showMessage('비밀번호 재설정 메일을 보냈습니다.\n이메일을 확인하세요.', 'success');
        }
      } else if (currentTab === 'signup') {
        if (!document.getElementById('agreeTerms').checked || !document.getElementById('agreePrivacy').checked) {
          showMessage('이용약관과 개인정보처리방침에 모두 동의해주세요.', 'error');
          btn.disabled = false;
          return;
        }
        const confirm = document.getElementById('confirmPassword').value;
        if (password !== confirm) {
          showMessage('비밀번호가 일치하지 않습니다.', 'error');
          btn.disabled = false;
          return;
        }

        const nickname = document.getElementById('nickname').value.trim() || email.split('@')[0];

        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: { data: { nickname } }
        });

        if (error) {
          showMessage(error.message, 'error');
        } else if (data.user && data.user.identities && data.user.identities.length === 0) {
          showMessage('이미 가입된 이메일입니다.', 'error');
        } else if (data.session) {
          showLoggedIn(data.user);
          notifyParent(data.user, 'login');
        } else {
          showMessage('회원가입 완료! 로그인해주세요.', 'success');
        }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          showMessage('이메일 또는 비밀번호가 올바르지 않습니다.', 'error');
        } else {
          showLoggedIn(data.user);
          notifyParent(data.user, 'login');
        }
      }
    } catch (err) {
      showMessage('오류가 발생했습니다: ' + err.message, 'error');
    }

    btn.disabled = false;
  }

  // ── Nickname update ──
  async function updateNickname() {
    if (!sb) return;
    const newNickname = document.getElementById('editNickname').value.trim();
    if (!newNickname) return alert('닉네임을 입력하세요.');

    const { data, error } = await sb.auth.updateUser({
      data: { nickname: newNickname }
    });

    const msg = document.getElementById('profileMsg');
    if (error) {
      msg.textContent = '변경 실패: ' + error.message;
      msg.style.color = '#dc2626';
    } else {
      msg.textContent = '닉네임이 변경되었습니다.';
      msg.style.color = '#059669';
      document.getElementById('profileNickname').textContent = newNickname;
      document.getElementById('profileAvatar').textContent = newNickname.charAt(0).toUpperCase();
      notifyParent(data.user, 'login');
    }
    msg.style.display = 'block';
  }

  async function handleLogout() {
    if (!sb) return;
    await sb.auth.signOut();
    document.getElementById('profileCard').classList.add('hidden');
    document.getElementById('authCard').classList.remove('hidden');
    notifyParent(null);
  }

  // ── 비밀번호 변경 ──
  async function changePassword() {
    if (!sb) return;

    const currentPw = document.getElementById('currentPw').value;
    const newPw = document.getElementById('newPw').value;
    const confirmNewPw = document.getElementById('confirmNewPw').value;
    const msg = document.getElementById('pwMsg');

    if (!currentPw || !newPw || !confirmNewPw) {
      showPwMsg('모든 항목을 입력하세요.', '#dc2626');
      return;
    }

    if (newPw.length < 6) {
      showPwMsg('새 비밀번호는 6자 이상이어야 합니다.', '#dc2626');
      return;
    }

    if (newPw !== confirmNewPw) {
      showPwMsg('새 비밀번호가 일치하지 않습니다.', '#dc2626');
      return;
    }

    const btn = document.querySelector('.pw-change-btn');
    btn.disabled = true;

    try {
      // 현재 비밀번호 확인 (별도 클라이언트로 검증하여 세션 영향 방지)
      const { data: { session } } = await sb.auth.getSession();
      const email = session?.user?.email;

      const tempClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false }
      });
      const { error: signInError } = await tempClient.auth.signInWithPassword({ email, password: currentPw });
      if (signInError) {
        showPwMsg('현재 비밀번호가 올바르지 않습니다.', '#dc2626');
        btn.disabled = false;
        return;
      }

      // 새 비밀번호로 변경
      const { error } = await sb.auth.updateUser({ password: newPw });
      if (error) {
        showPwMsg('변경 실패: ' + error.message, '#dc2626');
      } else {
        showPwMsg('비밀번호가 변경되었습니다.', '#059669');
        document.getElementById('currentPw').value = '';
        document.getElementById('newPw').value = '';
        document.getElementById('confirmNewPw').value = '';
      }
    } catch (err) {
      showPwMsg('오류가 발생했습니다: ' + err.message, '#dc2626');
    }

    btn.disabled = false;
  }

  function showPwMsg(text, color) {
    const msg = document.getElementById('pwMsg');
    msg.textContent = text;
    msg.style.color = color;
    msg.style.display = 'block';
  }

  // ── 회원탈퇴 ──
  function showDeleteModal() {
    document.getElementById('deletePassword').value = '';
    document.getElementById('deleteMessage').style.display = 'none';
    document.getElementById('deleteModal').classList.remove('hidden');
  }

  function hideDeleteModal() {
    document.getElementById('deleteModal').classList.add('hidden');
  }

  async function handleDeleteAccount() {
    if (!sb) return;

    const password = document.getElementById('deletePassword').value;
    if (!password) {
      showDeleteMessage('비밀번호를 입력하세요.', 'error');
      return;
    }

    const btn = document.getElementById('deleteConfirmBtn');
    btn.disabled = true;
    btn.textContent = '처리 중...';

    try {
      // 비밀번호 재확인 (별도 클라이언트로 검증하여 세션 영향 방지)
      const { data: { session } } = await sb.auth.getSession();
      const email = session?.user?.email;
      if (!email) throw new Error('세션 정보를 찾을 수 없습니다.');

      const tempClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false }
      });
      const { error: signInError } = await tempClient.auth.signInWithPassword({ email, password });
      if (signInError) {
        showDeleteMessage('비밀번호가 올바르지 않습니다.', 'error');
        btn.disabled = false;
        btn.textContent = '탈퇴하기';
        return;
      }

      const userId = session.user.id;

      // 사용자 데이터 삭제 (게시글, 댓글)
      await sb.from('comments').delete().eq('user_id', userId);
      await sb.from('posts').delete().eq('user_id', userId);

      // 계정 삭제 (Supabase RPC 함수 호출)
      const { error: deleteError } = await sb.rpc('delete_user');
      if (deleteError) throw deleteError;

      // 로그아웃 및 UI 초기화
      await sb.auth.signOut();
      hideDeleteModal();
      document.getElementById('profileCard').classList.add('hidden');
      document.getElementById('authCard').classList.remove('hidden');
      notifyParent(null, 'logout');
      showMessage('회원탈퇴가 완료되었습니다.', 'success');
    } catch (err) {
      showDeleteMessage('탈퇴 처리 중 오류: ' + err.message, 'error');
    }

    btn.disabled = false;
    btn.textContent = '탈퇴하기';
  }

  function showDeleteMessage(text, type) {
    const el = document.getElementById('deleteMessage');
    el.textContent = text;
    el.className = 'message ' + type;
    el.style.display = 'block';
  }

  // ── Supabase 초기화 ──
  async function init() {
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) {
        showLoggedIn(session.user);
        notifyParent(session.user);
      }
    } catch (err) {
      console.error('Supabase 초기화 실패:', err);
    }
  }

  init();
</script>

</body>
</html>
