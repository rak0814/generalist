<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot Machine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      overflow-x: hidden;
      color: #fff;
    }

    .machine {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Header */
    .machine-title {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(to right, #ffd700, #ffaa00, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      letter-spacing: -0.5px;
    }

    .machine-sub {
      font-size: 11px;
      color: #8888aa;
      text-align: center;
      margin-top: -8px;
    }

    /* Credit display */
    .credit-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .credit-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .credit-label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .credit-value {
      font-size: 18px;
      font-weight: 800;
      font-family: 'Courier New', monospace;
      color: #ffd700;
    }

    .credit-value.win-amount {
      color: #00ff88;
    }

    /* Reel area */
    .reel-frame {
      width: 100%;
      background: linear-gradient(180deg, #1a1a2e 0%, #16162a 100%);
      border-radius: 16px;
      padding: 16px 12px;
      border: 2px solid rgba(255,215,0,0.15);
      box-shadow: inset 0 4px 20px rgba(0,0,0,0.4), 0 0 30px rgba(255,215,0,0.05);
      position: relative;
      overflow: hidden;
    }

    .reel-frame::before,
    .reel-frame::after {
      content: '';
      position: absolute;
      left: 12px;
      right: 12px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent);
      z-index: 5;
      pointer-events: none;
    }

    .reel-frame::before { top: 60px; }
    .reel-frame::after { bottom: 60px; }

    .reels {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .reel-container {
      width: 90px;
      height: 180px;
      overflow: hidden;
      border-radius: 10px;
      background: #111128;
      position: relative;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
    }

    /* Gradient overlay on reel top/bottom */
    .reel-container::before,
    .reel-container::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 40px;
      z-index: 3;
      pointer-events: none;
    }

    .reel-container::before {
      top: 0;
      background: linear-gradient(to bottom, #111128, transparent);
    }

    .reel-container::after {
      bottom: 0;
      background: linear-gradient(to top, #111128, transparent);
    }

    .reel-strip {
      display: flex;
      flex-direction: column;
      transition: none;
    }

    .reel-strip.spinning {
      transition: none;
    }

    .reel-strip.stopping {
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1.05);
    }

    .reel-symbol {
      width: 90px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      flex-shrink: 0;
    }

    /* Win line highlight */
    .win-highlight {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 62px;
      border: 2px solid rgba(255,215,0,0.4);
      border-radius: 8px;
      z-index: 4;
      pointer-events: none;
      background: rgba(255,215,0,0.03);
    }

    .win-highlight.jackpot {
      border-color: #ffd700;
      background: rgba(255,215,0,0.1);
      box-shadow: 0 0 20px rgba(255,215,0,0.3);
      animation: jackpotGlow 0.5s ease-in-out infinite alternate;
    }

    @keyframes jackpotGlow {
      from { box-shadow: 0 0 10px rgba(255,215,0,0.2); }
      to { box-shadow: 0 0 30px rgba(255,215,0,0.5); }
    }

    /* Bet controls */
    .bet-area {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bet-label {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
    }

    .bet-buttons {
      display: flex;
      gap: 6px;
      flex: 1;
    }

    .bet-btn {
      flex: 1;
      padding: 8px 0;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #ccc;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .bet-btn:active { transform: scale(0.95); }
    .bet-btn.active {
      background: rgba(255,215,0,0.15);
      border-color: #ffd700;
      color: #ffd700;
    }

    /* Spin button */
    .spin-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      color: #1a1a2e;
      box-shadow: 0 4px 15px rgba(255,215,0,0.3);
      letter-spacing: 1px;
    }

    .spin-btn:active:not(:disabled) { transform: scale(0.97); }

    .spin-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .spin-btn.spinning {
      background: linear-gradient(135deg, #666, #444);
      color: #999;
      box-shadow: none;
    }

    /* Result message */
    .result-msg {
      min-height: 28px;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      transition: opacity 0.3s;
    }

    .result-msg.win {
      color: #ffd700;
      animation: resultPop 0.4s ease;
    }

    .result-msg.jackpot-msg {
      color: #ff4757;
      animation: resultPop 0.4s ease;
      font-size: 18px;
    }

    .result-msg.lose { color: #666; }

    @keyframes resultPop {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Paytable */
    .paytable {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .paytable-title {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-align: center;
    }

    .paytable-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 12px;
    }

    .paytable-row + .paytable-row {
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .paytable-symbols { color: #aaa; }
    .paytable-payout { color: #ffd700; font-weight: 700; font-family: monospace; }

    /* Reset button */
    .reset-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      color: #666;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .reset-btn:hover { border-color: #888; color: #aaa; }

    /* Confetti */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      top: -10px;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to { top: 110vh; transform: rotate(720deg); }
    }
  </style>
</head>
<body>

<div class="machine">
  <div class="machine-title">LUCKY SLOT</div>
  <div class="machine-sub">TRAVEL EDITION</div>

  <!-- Credits -->
  <div class="credit-bar">
    <div class="credit-item">
      <span class="credit-label">Credit</span>
      <span class="credit-value" id="creditDisplay">1,000</span>
    </div>
    <div class="credit-item">
      <span class="credit-label">Bet</span>
      <span class="credit-value" id="betDisplay">10</span>
    </div>
    <div class="credit-item">
      <span class="credit-label">Win</span>
      <span class="credit-value win-amount" id="winDisplay">0</span>
    </div>
  </div>

  <!-- Reels -->
  <div class="reel-frame">
    <div class="win-highlight" id="winLine"></div>
    <div class="reels">
      <div class="reel-container">
        <div class="reel-strip" id="reel0"></div>
      </div>
      <div class="reel-container">
        <div class="reel-strip" id="reel1"></div>
      </div>
      <div class="reel-container">
        <div class="reel-strip" id="reel2"></div>
      </div>
    </div>
  </div>

  <!-- Result -->
  <div class="result-msg" id="resultMsg"></div>

  <!-- Bet selection -->
  <div class="bet-area">
    <span class="bet-label">BET</span>
    <div class="bet-buttons">
      <button class="bet-btn active" data-bet="10">10</button>
      <button class="bet-btn" data-bet="50">50</button>
      <button class="bet-btn" data-bet="100">100</button>
      <button class="bet-btn" data-bet="500">500</button>
    </div>
  </div>

  <!-- Spin -->
  <button class="spin-btn" id="spinBtn">SPIN</button>

  <!-- Paytable -->
  <div class="paytable">
    <div class="paytable-title">Paytable (x Bet)</div>
    <div class="paytable-row"><span class="paytable-symbols">7️⃣ 7️⃣ 7️⃣ JACKPOT</span><span class="paytable-payout">x50</span></div>
    <div class="paytable-row"><span class="paytable-symbols">💎 💎 💎</span><span class="paytable-payout">x20</span></div>
    <div class="paytable-row"><span class="paytable-symbols">🗼 🗼 🗼 / 🏰 🏰 🏰</span><span class="paytable-payout">x10</span></div>
    <div class="paytable-row"><span class="paytable-symbols">같은 심볼 3개</span><span class="paytable-payout">x5</span></div>
    <div class="paytable-row"><span class="paytable-symbols">같은 심볼 2개</span><span class="paytable-payout">x2</span></div>
  </div>

  <button class="reset-btn" id="resetBtn">크레딧 초기화</button>
</div>

<div class="confetti-container" id="confettiBox"></div>

<script>
  const SYMBOLS = ['🗼', '🏰', '🗽', '🎡', '🏯', '💎', '7️⃣', '✈️'];
  const WEIGHTS = [18, 18, 16, 16, 14, 10, 4, 4]; // 7️⃣ and 💎 are rarer
  const REEL_SIZE = 60; // symbols per reel strip
  const SYM_H = 60;

  let credit = parseInt(localStorage.getItem('slot_credit')) || 1000;
  let bet = 10;
  let spinning = false;

  const reels = [0, 1, 2].map(i => document.getElementById('reel' + i));
  const spinBtn = document.getElementById('spinBtn');
  const resultMsg = document.getElementById('resultMsg');
  const creditDisplay = document.getElementById('creditDisplay');
  const betDisplay = document.getElementById('betDisplay');
  const winDisplay = document.getElementById('winDisplay');
  const winLine = document.getElementById('winLine');
  const confettiBox = document.getElementById('confettiBox');

  // Build weighted random symbol picker
  const weightedPool = [];
  WEIGHTS.forEach((w, i) => { for (let j = 0; j < w; j++) weightedPool.push(SYMBOLS[i]); });

  function randomSymbol() {
    return weightedPool[Math.floor(Math.random() * weightedPool.length)];
  }

  // Generate reel strips
  function buildReel(reelEl) {
    let html = '';
    for (let i = 0; i < REEL_SIZE; i++) {
      html += `<div class="reel-symbol">${randomSymbol()}</div>`;
    }
    reelEl.innerHTML = html;
  }

  function initReels() {
    reels.forEach(r => buildReel(r));
    // Position each reel to show middle symbol
    reels.forEach(r => {
      r.style.transform = `translateY(-${SYM_H}px)`;
    });
  }

  function updateDisplay() {
    creditDisplay.textContent = credit.toLocaleString();
    betDisplay.textContent = bet.toLocaleString();
    localStorage.setItem('slot_credit', credit);
  }

  // Get the center symbol (index 1 when showing 3 symbols)
  function getCenterSymbol(reelEl, stopIndex) {
    const symbols = reelEl.querySelectorAll('.reel-symbol');
    return symbols[stopIndex + 1]?.textContent || '';
  }

  // Spin logic
  async function spin() {
    if (spinning) return;
    if (credit < bet) {
      resultMsg.textContent = '크레딧이 부족합니다!';
      resultMsg.className = 'result-msg lose';
      return;
    }

    spinning = true;
    spinBtn.disabled = true;
    spinBtn.classList.add('spinning');
    spinBtn.textContent = 'SPINNING...';
    resultMsg.textContent = '';
    resultMsg.className = 'result-msg';
    winLine.classList.remove('jackpot');
    winDisplay.textContent = '0';

    credit -= bet;
    updateDisplay();

    // Rebuild reels with new symbols
    reels.forEach(r => buildReel(r));
    reels.forEach(r => {
      r.style.transition = 'none';
      r.style.transform = 'translateY(0)';
    });

    // Pick final results
    const results = [randomSymbol(), randomSymbol(), randomSymbol()];

    // Set the target symbols at specific positions
    reels.forEach((r, i) => {
      const symbols = r.querySelectorAll('.reel-symbol');
      const stopIndex = REEL_SIZE - 3; // stop near end
      symbols[stopIndex + 1].textContent = results[i]; // center
      symbols[stopIndex].textContent = randomSymbol(); // top
      symbols[stopIndex + 2].textContent = randomSymbol(); // bottom
    });

    // Animate: fast spin then stop sequentially
    for (let i = 0; i < 3; i++) {
      const r = reels[i];
      const stopPos = (REEL_SIZE - 3) * SYM_H;

      // Spin phase
      r.classList.remove('stopping');
      r.classList.add('spinning');

      await animateReel(r, stopPos, 800 + i * 400);
    }

    // Check results
    await sleep(200);
    checkWin(results);

    spinning = false;
    spinBtn.disabled = false;
    spinBtn.classList.remove('spinning');
    spinBtn.textContent = 'SPIN';
  }

  function animateReel(reel, stopPos, duration) {
    return new Promise(resolve => {
      const start = performance.now();
      const spinSpeed = stopPos / duration;
      let currentPos = 0;

      function frame(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);

        // Ease out cubic
        const eased = 1 - Math.pow(1 - progress, 3);
        currentPos = eased * stopPos;

        reel.style.transition = 'none';
        reel.style.transform = `translateY(-${currentPos}px)`;

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          reel.style.transform = `translateY(-${stopPos}px)`;
          resolve();
        }
      }

      requestAnimationFrame(frame);
    });
  }

  function checkWin(results) {
    const [a, b, c] = results;
    let multiplier = 0;
    let msg = '';

    if (a === b && b === c) {
      // Three of a kind
      if (a === '7️⃣') {
        multiplier = 50;
        msg = '🎉 JACKPOT!! 🎉';
        resultMsg.className = 'result-msg jackpot-msg';
        winLine.classList.add('jackpot');
        fireConfetti(40);
      } else if (a === '💎') {
        multiplier = 20;
        msg = '💎 다이아몬드! x20 💎';
        resultMsg.className = 'result-msg win';
        winLine.classList.add('jackpot');
        fireConfetti(25);
      } else if (a === '🗼' || a === '🏰') {
        multiplier = 10;
        msg = `${a}${a}${a} 대박! x10`;
        resultMsg.className = 'result-msg win';
        fireConfetti(15);
      } else {
        multiplier = 5;
        msg = `${a}${a}${a} 당첨! x5`;
        resultMsg.className = 'result-msg win';
        fireConfetti(10);
      }
    } else if (a === b || b === c || a === c) {
      multiplier = 2;
      const pair = a === b ? a : (b === c ? b : a);
      msg = `${pair}${pair} 2매치! x2`;
      resultMsg.className = 'result-msg win';
    } else {
      msg = '다시 도전!';
      resultMsg.className = 'result-msg lose';
    }

    if (multiplier > 0) {
      const winAmount = bet * multiplier;
      credit += winAmount;
      winDisplay.textContent = '+' + winAmount.toLocaleString();
    }

    resultMsg.textContent = msg;
    updateDisplay();
  }

  function fireConfetti(count) {
    const colors = ['#ffd700', '#ff4757', '#00ff88', '#3b82f6', '#ff6b81', '#a855f7', '#06d6a0'];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + '%';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      el.style.width = (4 + Math.random() * 6) + 'px';
      el.style.height = (4 + Math.random() * 6) + 'px';
      el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      el.style.animationDelay = (Math.random() * 0.5) + 's';
      confettiBox.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // Bet buttons
  document.querySelectorAll('.bet-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (spinning) return;
      bet = parseInt(btn.dataset.bet);
      document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateDisplay();
    });
  });

  // Spin
  spinBtn.addEventListener('click', spin);

  // Reset
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (spinning) return;
    credit = 1000;
    updateDisplay();
    resultMsg.textContent = '크레딧이 초기화되었습니다';
    resultMsg.className = 'result-msg lose';
    winDisplay.textContent = '0';
  });

  // Init
  initReels();
  updateDisplay();
</script>

</body>
</html>
