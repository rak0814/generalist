<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>번역기</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 50px;
      max-width: 700px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    h1 {
      text-align: center;
      font-size: 24px;
      color: #333;
      margin-bottom: 30px;
    }
    .lang-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    select {
      padding: 10px 16px;
      font-size: 15px;
      font-family: inherit;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      background: #fff;
      min-width: 140px;
      transition: border-color 0.2s;
    }
    select:focus { border-color: #667eea; }
    .swap-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.3s;
      flex-shrink: 0;
    }
    .swap-btn:hover { transform: rotate(180deg); }
    .input-wrap {
      position: relative;
    }
    textarea {
      width: 100%;
      height: 120px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px;
      padding-right: 50px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #667eea; }
    .mic-btn {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #e0e0e0;
      background: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .mic-btn:hover { border-color: #667eea; background: #f8f9ff; }
    .mic-btn.recording {
      border-color: #e74c3c;
      background: #fdeaea;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.3); }
      50% { box-shadow: 0 0 0 8px rgba(231,76,60,0); }
    }
    .translate-btn {
      display: block;
      width: 100%;
      margin: 20px 0;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .translate-btn:hover { opacity: 0.9; }
    .translate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .result-wrap {
      position: relative;
    }
    .result-box {
      background: #f8f9ff;
      border: 2px solid #e8eaff;
      border-radius: 12px;
      padding: 16px;
      padding-right: 50px;
      min-height: 60px;
      font-size: 16px;
      color: #333;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .result-box.empty { color: #aaa; }
    .speak-btn {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #e8eaff;
      background: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .speak-btn:hover { border-color: #667eea; background: #f0f2ff; }
    .speak-btn.speaking {
      border-color: #667eea;
      background: #e8eaff;
    }
    .bottom-bar {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .speak-source-btn {
      padding: 8px 16px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .speak-source-btn:hover { background: #e0e0e0; }
    .copy-btn {
      padding: 8px 20px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .copy-btn:hover { background: #e0e0e0; }
    .note {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #aaa;
    }

    /* 모바일 최적화 */
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 12px;
        min-height: 100dvh;
      }
      .card {
        width: 100%;
        padding: 24px 20px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      }
      h1 {
        font-size: 20px;
        margin-bottom: 20px;
      }
      .lang-bar {
        flex-wrap: wrap;
        gap: 8px;
      }
      select {
        min-width: 0;
        flex: 1;
        font-size: 14px;
        padding: 10px 10px;
      }
      .swap-btn {
        width: 36px;
        height: 36px;
        font-size: 16px;
        order: 0;
      }
      textarea {
        height: 100px;
        font-size: 15px;
        padding: 14px;
        padding-right: 46px;
      }
      .mic-btn {
        width: 34px;
        height: 34px;
        font-size: 16px;
        right: 10px;
        top: 10px;
      }
      .translate-btn {
        margin: 16px 0;
        padding: 13px;
        font-size: 16px;
        border-radius: 10px;
      }
      .result-box {
        font-size: 15px;
        padding: 14px;
        padding-right: 46px;
        min-height: 50px;
      }
      .speak-btn {
        width: 34px;
        height: 34px;
        font-size: 16px;
        right: 10px;
        top: 10px;
      }
      .bottom-bar {
        margin-top: 8px;
      }
      .speak-source-btn,
      .copy-btn {
        font-size: 12px;
        padding: 7px 14px;
      }
      .note {
        margin-top: 12px;
        font-size: 11px;
      }
    }

    /* 아주 작은 화면 (SE 등) */
    @media (max-width: 380px) {
      .card {
        padding: 20px 16px;
      }
      select {
        font-size: 13px;
        padding: 8px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>번역기</h1>
    <div class="lang-bar">
      <select id="sourceLang">
        <option value="ko">한국어</option>
        <option value="en">영어 (English)</option>
        <option value="ja">일본어 (日本語)</option>
        <option value="zh-CN">중국어 간체 (中文)</option>
        <option value="zh-TW">중국어 번체 (繁體)</option>
        <option value="es">스페인어 (Español)</option>
        <option value="fr">프랑스어 (Français)</option>
        <option value="de">독일어 (Deutsch)</option>
        <option value="pt">포르투갈어 (Português)</option>
        <option value="it">이탈리아어 (Italiano)</option>
        <option value="ru">러시아어 (Русский)</option>
        <option value="ar">아랍어 (العربية)</option>
        <option value="hi">힌디어 (हिन्दी)</option>
        <option value="th">태국어 (ไทย)</option>
        <option value="vi">베트남어 (Tiếng Việt)</option>
        <option value="id">인도네시아어 (Bahasa)</option>
        <option value="ms">말레이어 (Melayu)</option>
        <option value="tl">필리핀어 (Filipino)</option>
        <option value="tr">터키어 (Türkçe)</option>
        <option value="nl">네덜란드어 (Nederlands)</option>
        <option value="pl">폴란드어 (Polski)</option>
        <option value="sv">스웨덴어 (Svenska)</option>
        <option value="da">덴마크어 (Dansk)</option>
        <option value="no">노르웨이어 (Norsk)</option>
        <option value="fi">핀란드어 (Suomi)</option>
        <option value="el">그리스어 (Ελληνικά)</option>
        <option value="cs">체코어 (Čeština)</option>
        <option value="ro">루마니아어 (Română)</option>
        <option value="hu">헝가리어 (Magyar)</option>
        <option value="uk">우크라이나어 (Українська)</option>
        <option value="he">히브리어 (עברית)</option>
        <option value="bn">벵골어 (বাংলা)</option>
        <option value="sw">스와힐리어 (Kiswahili)</option>
        <option value="mn">몽골어 (Монгол)</option>
      </select>
      <button class="swap-btn" id="swapBtn" title="언어 전환">⇄</button>
      <select id="targetLang">
        <option value="en" selected>영어 (English)</option>
        <option value="ko">한국어</option>
        <option value="ja">일본어 (日本語)</option>
        <option value="zh-CN">중국어 간체 (中文)</option>
        <option value="zh-TW">중국어 번체 (繁體)</option>
        <option value="es">스페인어 (Español)</option>
        <option value="fr">프랑스어 (Français)</option>
        <option value="de">독일어 (Deutsch)</option>
        <option value="pt">포르투갈어 (Português)</option>
        <option value="it">이탈리아어 (Italiano)</option>
        <option value="ru">러시아어 (Русский)</option>
        <option value="ar">아랍어 (العربية)</option>
        <option value="hi">힌디어 (हिन्दी)</option>
        <option value="th">태국어 (ไทย)</option>
        <option value="vi">베트남어 (Tiếng Việt)</option>
        <option value="id">인도네시아어 (Bahasa)</option>
        <option value="ms">말레이어 (Melayu)</option>
        <option value="tl">필리핀어 (Filipino)</option>
        <option value="tr">터키어 (Türkçe)</option>
        <option value="nl">네덜란드어 (Nederlands)</option>
        <option value="pl">폴란드어 (Polski)</option>
        <option value="sv">스웨덴어 (Svenska)</option>
        <option value="da">덴마크어 (Dansk)</option>
        <option value="no">노르웨이어 (Norsk)</option>
        <option value="fi">핀란드어 (Suomi)</option>
        <option value="el">그리스어 (Ελληνικά)</option>
        <option value="cs">체코어 (Čeština)</option>
        <option value="ro">루마니아어 (Română)</option>
        <option value="hu">헝가리어 (Magyar)</option>
        <option value="uk">우크라이나어 (Українська)</option>
        <option value="he">히브리어 (עברית)</option>
        <option value="bn">벵골어 (বাংলা)</option>
        <option value="sw">스와힐리어 (Kiswahili)</option>
        <option value="mn">몽골어 (Монгол)</option>
      </select>
    </div>

    <div class="input-wrap">
      <textarea id="input" placeholder="번역할 문장을 입력하세요..."></textarea>
      <button class="mic-btn" id="micBtn" title="음성 입력">🎤</button>
    </div>

    <button class="translate-btn" id="translateBtn">번역하기</button>

    <div class="result-wrap">
      <div class="result-box empty" id="result">번역 결과가 여기에 표시됩니다</div>
      <button class="speak-btn" id="speakResultBtn" title="번역 결과 듣기">🔊</button>
    </div>

    <div class="bottom-bar">
      <button class="speak-source-btn" id="speakSourceBtn">🔊 원문 듣기</button>
      <button class="copy-btn" id="copyBtn">복사</button>
    </div>

    <p class="note">* 음성 입력은 Chrome 브라우저에서 가장 잘 작동합니다</p>
  </div>

  <script>
    const sourceLangEl = document.getElementById('sourceLang');
    const targetLangEl = document.getElementById('targetLang');
    const swapBtn = document.getElementById('swapBtn');
    const inputEl = document.getElementById('input');
    const translateBtn = document.getElementById('translateBtn');
    const resultEl = document.getElementById('result');
    const copyBtn = document.getElementById('copyBtn');
    const micBtn = document.getElementById('micBtn');
    const speakResultBtn = document.getElementById('speakResultBtn');
    const speakSourceBtn = document.getElementById('speakSourceBtn');

    // 언어코드 → 음성인식 locale 매핑
    const speechLangMap = {
      'ko': 'ko-KR', 'en': 'en-US', 'ja': 'ja-JP', 'zh-CN': 'zh-CN', 'zh-TW': 'zh-TW',
      'es': 'es-ES', 'fr': 'fr-FR', 'de': 'de-DE', 'pt': 'pt-BR', 'it': 'it-IT',
      'ru': 'ru-RU', 'ar': 'ar-SA', 'hi': 'hi-IN', 'th': 'th-TH', 'vi': 'vi-VN',
      'id': 'id-ID', 'ms': 'ms-MY', 'tl': 'fil-PH', 'tr': 'tr-TR', 'nl': 'nl-NL',
      'pl': 'pl-PL', 'sv': 'sv-SE', 'da': 'da-DK', 'no': 'nb-NO', 'fi': 'fi-FI',
      'el': 'el-GR', 'cs': 'cs-CZ', 'ro': 'ro-RO', 'hu': 'hu-HU', 'uk': 'uk-UA',
      'he': 'he-IL', 'bn': 'bn-IN', 'sw': 'sw-KE', 'mn': 'mn-MN'
    };

    // 언어 전환
    swapBtn.addEventListener('click', () => {
      const temp = sourceLangEl.value;
      sourceLangEl.value = targetLangEl.value;
      targetLangEl.value = temp;
    });

    // 번역
    async function translate(text, sl, tl) {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      const data = await res.json();
      return data[0].map(s => s[0]).join('');
    }

    translateBtn.addEventListener('click', async () => {
      const text = inputEl.value.trim();
      if (!text) return;

      const sl = sourceLangEl.value;
      const tl = targetLangEl.value;
      if (sl === tl) {
        resultEl.textContent = text;
        resultEl.classList.remove('empty');
        return;
      }

      translateBtn.disabled = true;
      translateBtn.textContent = '번역 중...';
      resultEl.textContent = '';
      resultEl.classList.add('empty');

      try {
        const translated = await translate(text, sl, tl);
        resultEl.textContent = translated;
        resultEl.classList.remove('empty');
      } catch (e) {
        resultEl.textContent = '번역에 실패했습니다. 인터넷 연결을 확인해주세요.';
      }

      translateBtn.disabled = false;
      translateBtn.textContent = '번역하기';
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        translateBtn.click();
      }
    });

    // 음성 입력 (STT)
    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onresult = (e) => {
        let transcript = '';
        for (let i = 0; i < e.results.length; i++) {
          transcript += e.results[i][0].transcript;
        }
        inputEl.value = transcript;
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
      };

      recognition.onerror = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
      };
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) {
        alert('이 브라우저는 음성 입력을 지원하지 않습니다.\nChrome 브라우저를 사용해주세요.');
        return;
      }

      if (isRecording) {
        recognition.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
      } else {
        recognition.lang = speechLangMap[sourceLangEl.value] || 'ko-KR';
        recognition.start();
        isRecording = true;
        micBtn.classList.add('recording');
      }
    });

    // 발음 듣기 (TTS)
    function speak(text, langCode) {
      if (!text || !window.speechSynthesis) {
        alert('이 브라우저는 음성 출력을 지원하지 않습니다.');
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = speechLangMap[langCode] || langCode;
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    }

    // 번역 결과 듣기
    speakResultBtn.addEventListener('click', () => {
      const text = resultEl.textContent;
      if (!text || resultEl.classList.contains('empty')) return;
      speakResultBtn.classList.add('speaking');
      speak(text, targetLangEl.value);
      setTimeout(() => speakResultBtn.classList.remove('speaking'), 2000);
    });

    // 원문 듣기
    speakSourceBtn.addEventListener('click', () => {
      const text = inputEl.value.trim();
      if (!text) return;
      speak(text, sourceLangEl.value);
    });

    // 복사
    copyBtn.addEventListener('click', () => {
      const text = resultEl.textContent;
      if (!text || resultEl.classList.contains('empty')) return;
      navigator.clipboard.writeText(text);
      copyBtn.textContent = '복사됨!';
      setTimeout(() => copyBtn.textContent = '복사', 1500);
    });
  </script>
</body>
</html>
