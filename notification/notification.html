<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .noti-header {
      background: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    .noti-header h2 {
      font-size: 17px;
      font-weight: 700;
      color: #111;
    }

    .header-btns {
      display: flex;
      gap: 12px;
    }

    .header-action-btn {
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .header-action-btn:hover { text-decoration: underline; }
    .header-action-btn.read { color: #6366f1; }
    .header-action-btn.delete { color: #dc2626; }

    .noti-delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 4px;
      align-self: center;
    }

    .noti-delete-btn:hover { color: #dc2626; }

    .noti-list {
      flex: 1;
      overflow-y: auto;
    }

    .noti-item {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      background: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .noti-item:active { background: #f8f8f8; }

    .noti-item.unread {
      background: #f0f4ff;
    }

    .noti-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .noti-icon.comment { background: #eef2ff; }
    .noti-icon.like { background: #fff1f2; }
    .noti-icon.comment_like { background: #fef3c7; }
    .noti-icon.message { background: #f0fdf4; }

    .noti-body {
      flex: 1;
      min-width: 0;
    }

    .noti-text {
      font-size: 14px;
      color: #333;
      line-height: 1.5;
      margin-bottom: 2px;
    }

    .noti-text strong {
      font-weight: 600;
      color: #111;
    }

    .noti-preview {
      font-size: 13px;
      color: #999;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 2px;
    }

    .noti-time {
      font-size: 11px;
      color: #bbb;
    }

    .noti-dot {
      width: 8px;
      height: 8px;
      background: #6366f1;
      border-radius: 50%;
      flex-shrink: 0;
      align-self: center;
    }

    .noti-dot.read { visibility: hidden; }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #bbb;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .empty-state p { font-size: 14px; }

    .login-prompt {
      text-align: center;
      padding: 80px 20px;
    }

    .login-prompt .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
    .login-prompt p { color: #888; font-size: 14px; margin-bottom: 16px; }

    .login-prompt button {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="noti-header">
  <h2>알림</h2>
  <div class="header-btns">
    <button class="header-action-btn read" id="readAllBtn" onclick="markAllRead()">모두 읽음</button>
    <button class="header-action-btn delete" id="deleteAllBtn" onclick="deleteAllNotifications()">전체 삭제</button>
  </div>
</div>

<div id="loginPrompt" class="login-prompt" style="display:none;">
  <div class="icon"><i data-lucide="bell" style="width:40px;height:40px;"></i></div>
  <p>로그인 후 이용할 수 있습니다</p>
  <button onclick="goToAuth()">로그인</button>
</div>

<div class="noti-list" id="notiList">
  <div class="empty-state" id="emptyState">
    <div class="icon"><i data-lucide="bell" style="width:40px;height:40px;"></i></div>
    <p>알림이 없습니다</p>
  </div>
</div>

<script>
  let sb = null;
  let currentUser = null;

  async function init() {
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await sb.auth.getSession();

      if (session?.user) {
        currentUser = session.user;
        document.getElementById('loginPrompt').style.display = 'none';
        loadNotifications();
      } else {
        document.getElementById('loginPrompt').style.display = 'block';
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('readAllBtn').style.display = 'none';
      }
    } catch (err) {
      console.error('초기화 실패:', err);
    }
  }

  function goToAuth() {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'go-to-auth' }, '*');
    }
  }

  async function loadNotifications() {
    if (!sb || !currentUser) return;

    const { data, error } = await sb
      .from('notifications')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false })
      .limit(50);

    if (error || !data || data.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      return;
    }

    document.getElementById('emptyState').style.display = 'none';

    const listEl = document.getElementById('notiList');
    listEl.innerHTML = data.map(n => {
      const iconClass = n.type || 'comment';
      const icon = getIcon(n.type);
      const text = buildText(n);
      const preview = n.preview ? `<p class="noti-preview">"${escapeHtml(n.preview)}"</p>` : '';

      return `
        <div class="noti-item ${n.is_read ? '' : 'unread'}" id="noti-${n.id}" onclick="markRead('${n.id}', this)">
          <div class="noti-icon ${iconClass}">${icon}</div>
          <div class="noti-body">
            <p class="noti-text">${text}</p>
            ${preview}
            <p class="noti-time">${formatTime(n.created_at)}</p>
          </div>
          <button class="noti-delete-btn" onclick="event.stopPropagation(); deleteNotification('${n.id}')"><i data-lucide="x" style="width:14px;height:14px;"></i></button>
        </div>`;
    }).join('');
    lucide.createIcons();
  }

  function getIcon(type) {
    switch (type) {
      case 'comment': return '<i data-lucide="message-circle" style="width:20px;height:20px;"></i>';
      case 'like': return '<i data-lucide="heart" style="width:20px;height:20px;"></i>';
      case 'comment_like': return '<i data-lucide="thumbs-up" style="width:20px;height:20px;"></i>';
      case 'message': return '<i data-lucide="send" style="width:20px;height:20px;"></i>';
      default: return '<i data-lucide="bell" style="width:20px;height:20px;"></i>';
    }
  }

  function buildText(n) {
    const actor = `<strong>${escapeHtml(n.actor_nickname)}</strong>`;
    switch (n.type) {
      case 'comment':
        return `${actor}님이 내 글에 댓글을 남겼습니다`;
      case 'like':
        return `${actor}님이 내 글을 좋아합니다`;
      case 'comment_like':
        return `${actor}님이 내 댓글을 좋아합니다`;
      case 'message':
        return `${actor}님이 메시지를 보냈습니다`;
      default:
        return `${actor}님의 알림`;
    }
  }

  async function markRead(id, el) {
    if (!sb) return;
    el.classList.remove('unread');
    const dot = el.querySelector('.noti-dot');
    if (dot) dot.classList.add('read');
    await sb.from('notifications').update({ is_read: true }).eq('id', id);
    notifyParentBadge();
  }

  async function markAllRead() {
    if (!sb || !currentUser) return;
    await sb.from('notifications')
      .update({ is_read: true })
      .eq('user_id', currentUser.id)
      .eq('is_read', false);

    document.querySelectorAll('.noti-item.unread').forEach(el => {
      el.classList.remove('unread');
      const dot = el.querySelector('.noti-dot');
      if (dot) dot.classList.add('read');
    });
    notifyParentBadge();
  }

  async function deleteNotification(id) {
    if (!sb) return;
    await sb.from('notifications').delete().eq('id', id);
    const el = document.getElementById('noti-' + id);
    if (el) el.remove();

    // 목록이 비었으면 빈 상태 표시
    if (!document.querySelector('.noti-item')) {
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('notiList').prepend(document.getElementById('emptyState'));
    }
    notifyParentBadge();
  }

  async function deleteAllNotifications() {
    if (!sb || !currentUser) return;
    if (!confirm('모든 알림을 삭제하시겠습니까?')) return;
    await sb.from('notifications').delete().eq('user_id', currentUser.id);
    document.getElementById('notiList').innerHTML = '';
    document.getElementById('notiList').innerHTML = '<div class="empty-state" id="emptyState"><div class="icon"><i data-lucide="bell" style="width:40px;height:40px;"></i></div><p>알림이 없습니다</p></div>';
    lucide.createIcons();
    notifyParentBadge();
  }

  function notifyParentBadge() {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'noti-read' }, '*');
    }
  }

  function formatTime(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return '방금 전';
    if (diff < 3600000) return Math.floor(diff / 60000) + '분 전';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '시간 전';
    if (diff < 172800000) return '어제';
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  init();
  lucide.createIcons();
</script>

</body>
</html>
