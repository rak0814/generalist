<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원형 달력</title>
    <style>
body {
    margin: 0;
    overflow: hidden;
    touch-action: none;
}

#app {
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background-color: #f0f0f0;
    background-image: url(https://contents.verygoodtour.com/Images/common/cloud_bg.png);
    background-repeat: no-repeat;
    background-size: cover;
    position: relative;
}

        #calendar {
            width: 85vmin;
            height: 85vmin;
            border-radius: 50%;
            position: relative;
            transition: transform 0.5s ease;
            border: 5px dotted #266ac9;
        }

        .month-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4vmin;
            pointer-events: none;
        }

        .center-card {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40vmin;
            height: 54vmin;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 1.5vmin;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.5s ease;
            border: 4px solid transparent;
            border-image: linear-gradient(to bottom right, #b827fc 0%, #2c90fc 25%, #b8fd33 50%, #fec837 75%, #fd1892 100%);
            border-image-slice: 1;
            overflow: hidden;
        }

        .center-card.active {
            opacity: 1;
        }

        .center-card .card-month {
            font-size: 2.2vmin;
            font-weight: bold;
            margin: 0.5vmin 0;
            color: #3498db;
        }

        .center-card .card-dest {
            font-size: 3vmin;
            font-weight: bold;
            margin: 0.3vmin 0;
            color: #222;
        }

        .center-card .card-flag {
            font-size: 3.5vmin;
            margin: 0.3vmin 0;
        }

        .center-card .card-img {
            width: 100%;
            flex: 1;
            border-radius: 6px;
            object-fit: cover;
            margin: 1vmin 0;
            min-height: 0;
        }

        .center-card .card-desc {
            font-size: 1.8vmin;
            color: #555;
            line-height: 1.5;
            margin: 0.3vmin 0;
        }

        .center-card .card-link {
            display: inline-block;
            font-size: 1.8vmin;
            color: #fff;
            background: linear-gradient(135deg, #3498db, #2c90fc);
            padding: 0.8vmin 2vmin;
            border-radius: 20px;
            text-decoration: none;
            margin: 0.5vmin 0;
            transition: opacity 0.2s;
        }
        .center-card .card-link:hover {
            opacity: 0.85;
        }

        .card-nav {
            display: flex;
            gap: 1.5vmin;
            margin-top: 0.5vmin;
        }
        .card-nav button {
            font-size: 2vmin;
            padding: 0.5vmin 2vmin;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        .card-nav button:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>

  <div id="app">
    <div id="calendar"></div>

    <div class="center-card active" id="centerCard">
      <div class="card-month" id="cardMonth">1월 추천</div>
      <div class="card-flag" id="cardFlag"></div>
      <div class="card-dest" id="cardDest"></div>
      <img class="card-img" id="cardImg" src="" alt="">
      <div class="card-desc" id="cardDesc"></div>
      <a class="card-link" id="cardLink" href="#">관련상품 더보기</a>
      <div class="card-nav">
          <button id="prevBtn">◀ 이전</button>
          <button id="nextBtn">다음 ▶</button>
      </div>
    </div>
  </div>

<script>
    const months = [
        {
            name: "1월",
            dest: "스위스 체르마트",
            flag: "\ud83c\udde8\ud83c\udded",
            img: "https://contents.verygoodtour.com/content/210/SE/0000/STO/image/1995833_2.jpg",
            desc: "알프스 설경과 스키의 천국\n마테호른을 배경으로 즐기는 겨울 스포츠",
            link: "https://www.verygoodtour.com/search?keyword=스위스"
        },
        {
            name: "2월",
            dest: "일본 홋카이도",
            flag: "\ud83c\uddef\ud83c\uddf5",
            img: "https://contents.verygoodtour.com/content/210/NO/0000/OL2/image/1995815_2.jpg",
            desc: "삿포로 눈축제와 겨울 온천\n설국의 낭만과 따뜻한 노천탕의 힐링",
            link: "https://www.verygoodtour.com/search?keyword=홋카이도"
        },
        {
            name: "3월",
            dest: "대만 타이베이",
            flag: "\ud83c\uddf9\ud83c\uddfc",
            img: "https://contents.verygoodtour.com/content/210/SE/0000/STO/image/1995833_2.jpg",
            desc: "야시장 미식투어와 봄꽃 여행\n지우펀 골목, 딘타이펑, 화련 타로코 협곡",
            link: "https://www.verygoodtour.com/search?keyword=대만"
        },
        {
            name: "4월",
            dest: "일본 교토",
            flag: "\ud83c\uddef\ud83c\uddf5",
            img: "https://contents.verygoodtour.com/content/210/HR/0000/CD1/image/1859546_1.jpg",
            desc: "벚꽃 절정의 계절\n기요미즈데라, 아라시야마의 만개한 벚꽃길",
            link: "https://www.verygoodtour.com/search?keyword=교토"
        },
        {
            name: "5월",
            dest: "크로아티아 두브로브니크",
            flag: "\ud83c\udded\ud83c\uddf7",
            img: "https://contents.verygoodtour.com/content/210/HR/0000/CD1/image/1859546_1.jpg",
            desc: "아드리아해의 진주, 지중해 봄 여행\n성벽 투어와 플리트비체 국립공원",
            link: "https://www.verygoodtour.com/search?keyword=크로아티아"
        },
        {
            name: "6월",
            dest: "영국 런던",
            flag: "\ud83c\uddec\ud83c\udde7",
            img: "https://contents.verygoodtour.com/content/210/PL/0000/KRK/image/1990609_2.jpg",
            desc: "해가 긴 여름의 시작, 영국 여행 최적기\n빅벤, 대영박물관, 코츠월드 근교투어",
            link: "https://www.verygoodtour.com/search?keyword=영국"
        },
        {
            name: "7월",
            dest: "몽골 울란바토르",
            flag: "\ud83c\uddf2\ud83c\uddf3",
            img: "https://contents.verygoodtour.com/content/320/MN/0000/ULN/image/1966131_2.jpg",
            desc: "끝없는 초원과 나담축제\n게르 체험, 승마, 테를지 국립공원",
            link: "https://www.verygoodtour.com/search?keyword=몽골"
        },
        {
            name: "8월",
            dest: "노르웨이 피오르드",
            flag: "\ud83c\uddf3\ud83c\uddf4",
            img: "https://contents.verygoodtour.com/content/210/NO/0000/OL2/image/1995815_2.jpg",
            desc: "백야 속 대자연 피오르드 투어\n송네피오르드, 트롤퉁가 트레킹",
            link: "https://www.verygoodtour.com/search?keyword=노르웨이"
        },
        {
            name: "9월",
            dest: "터키 이스탄불",
            flag: "\ud83c\uddf9\ud83c\uddf7",
            img: "https://contents.verygoodtour.com/content/210/SE/0000/STO/image/1995833_2.jpg",
            desc: "동서양이 만나는 가을 감성 여행\n카파도키아 열기구, 파묵칼레 온천",
            link: "https://www.verygoodtour.com/search?keyword=터키"
        },
        {
            name: "10월",
            dest: "캐나다 메이플로드",
            flag: "\ud83c\udde8\ud83c\udde6",
            img: "https://contents.verygoodtour.com/content/210/HR/0000/CD1/image/1859546_1.jpg",
            desc: "세계 3대 단풍 로렌시안 고원\n나이아가라 폭포와 붉게 물든 메이플로드",
            link: "https://www.verygoodtour.com/search?keyword=캐나다"
        },
        {
            name: "11월",
            dest: "폴란드 크라쿠프",
            flag: "\ud83c\uddf5\ud83c\uddf1",
            img: "https://contents.verygoodtour.com/content/210/PL/0000/KRK/image/1990609_2.jpg",
            desc: "가을 감성의 동유럽 소도시\n비엘리치카 소금광산, 아우슈비츠 역사투어",
            link: "https://www.verygoodtour.com/search?keyword=폴란드"
        },
        {
            name: "12월",
            dest: "스웨덴 스톡홀름",
            flag: "\ud83c\uddf8\ud83c\uddea",
            img: "https://contents.verygoodtour.com/content/210/SE/0000/STO/image/1995833_2.jpg",
            desc: "북유럽 크리스마스 마켓의 감동\n감라스탄 구시가지, 오로라 헌팅",
            link: "https://www.verygoodtour.com/search?keyword=스웨덴"
        },
    ];

    const calendar = document.getElementById('calendar');
    const centerCard = document.getElementById('centerCard');
    const cardMonth = document.getElementById('cardMonth');
    const cardFlag = document.getElementById('cardFlag');
    const cardDest = document.getElementById('cardDest');
    const cardImg = document.getElementById('cardImg');
    const cardDesc = document.getElementById('cardDesc');
    const cardLink = document.getElementById('cardLink');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // 원형으로 월 배치
    months.forEach((month, index) => {
        const monthDiv = document.createElement('div');
        monthDiv.className = 'month-circle';
        monthDiv.innerText = month.name;
        
        const angle = (index / months.length) * 360;
        monthDiv.style.transform = `rotate(${angle}deg) translateY(-45%)`;
        
        calendar.appendChild(monthDiv);
    });

    let currentAngle = 0;
    const rotationStep = 30;

    function updateCard() {
        const currentIndex = Math.round(-currentAngle / rotationStep) % months.length;
        const monthData = months[(currentIndex + months.length) % months.length];

        cardMonth.textContent = monthData.name + ' 추천';
        cardFlag.textContent = monthData.flag;
        cardDest.textContent = monthData.dest;
        cardImg.src = monthData.img;
        cardImg.alt = monthData.dest;
        cardDesc.textContent = monthData.desc;
        cardLink.href = monthData.link;

        centerCard.classList.remove('active');
        setTimeout(() => {
            centerCard.classList.add('active');
        }, 100);
    }

    // 초기 카드 세팅
    updateCard();

    function rotateCalendar(direction) {
        currentAngle += direction * rotationStep;
        calendar.style.transform = `rotate(${currentAngle}deg)`;
        updateCard();
    }

    // PC용 스크롤 이벤트

    //전체 영역
    // window.addEventListener('wheel', (event) => {
    //     if (event.deltaY > 0) {
    //         rotateCalendar(-1);
    //     } else {
    //         rotateCalendar(1);
    //     }
    //     event.preventDefault();
    // });


    //달력 영역만
    window.addEventListener('wheel', (event) => {
        const isInside = calendar.contains(event.target) || centerCard.contains(event.target);

        if (isInside) {
            if (event.deltaY > 0) {
                rotateCalendar(-1);
            } else {
                rotateCalendar(1);
            }
            event.preventDefault(); // calendar 또는 centerCard 안에서만 휠 회전
        }
    }, { passive: false });

    // 모바일/PC 공통 버튼 클릭
    prevBtn.addEventListener('click', () => rotateCalendar(1));
    nextBtn.addEventListener('click', () => rotateCalendar(-1));





  // 모바일터치 (달력/카드 영역만)

  let startY = 0;
  let isTouchInsideCalendar = false;

  window.addEventListener('touchstart', (e) => {
    isTouchInsideCalendar = calendar.contains(e.target) || centerCard.contains(e.target);
    if (isTouchInsideCalendar) {
      startY = e.touches[0].clientY;
    }
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    if (isTouchInsideCalendar) {
      e.preventDefault(); // 터치 스와이프 시 페이지 스크롤 방지
    }
  }, { passive: false });

  window.addEventListener('touchend', (e) => {
    if (!isTouchInsideCalendar) return;

    const endY = e.changedTouches[0].clientY;
    const deltaY = startY - endY;

    if (Math.abs(deltaY) < 30) return; // 작은 움직임은 무시

    if (deltaY > 0) {
      // 위로 스와이프 → 다음 달
      rotateCalendar(-1);
    } else {
      // 아래로 스와이프 → 이전 달
      rotateCalendar(1);
    }
  });



</script>

</body>
</html>
