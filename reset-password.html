<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 재설정</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: #888;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background: #fafafa;
    }

    .form-group input:focus {
      border-color: #6366f1;
      background: #fff;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .home-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #6366f1;
      font-size: 14px;
      text-decoration: none;
    }

    .home-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">G</div>
    <h1>비밀번호 재설정</h1>
    <p>새로운 비밀번호를 입력하세요</p>
  </div>

  <div class="card">
    <form onsubmit="handleReset(event)">
      <div class="form-group">
        <label>새 비밀번호</label>
        <input type="password" id="newPassword" placeholder="6자 이상 입력하세요" required minlength="6">
      </div>
      <div class="form-group">
        <label>새 비밀번호 확인</label>
        <input type="password" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요" required minlength="6">
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">비밀번호 변경</button>
    </form>

    <div class="message" id="message"></div>
  </div>

  <a href="index.html" class="home-link">홈으로 돌아가기</a>
</div>

<script>
  let sb = null;

  function showMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = 'message ' + type;
    el.style.display = 'block';
  }

  async function handleReset(e) {
    e.preventDefault();
    if (!sb) { showMessage('서버 연결 중입니다.', 'error'); return; }

    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (password !== confirm) {
      showMessage('비밀번호가 일치하지 않습니다.', 'error');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    const { error } = await sb.auth.updateUser({ password });

    if (error) {
      showMessage('변경 실패: ' + error.message, 'error');
    } else {
      showMessage('비밀번호가 변경되었습니다! 홈으로 돌아가서 로그인하세요.', 'success');
      document.querySelector('form').style.display = 'none';
    }

    btn.disabled = false;
  }

  async function init() {
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      sb.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          // 세션이 자동으로 설정됨, 폼 표시 상태 유지
        }
      });
    } catch (err) {
      showMessage('서버 연결에 실패했습니다.', 'error');
    }
  }

  init();
</script>

</body>
</html>
