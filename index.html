<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="author" content="Generalist">
  <meta name="theme-color" content="#111111">

  <!-- Open Graph (카카오톡, 페이스북 등 공유 미리보기) -->
  <meta property="og:title" content="Generalist - 올인원 유틸리티 앱">
  <meta property="og:description" content="날씨, 환율, AI 채팅, 번역, 여행 정보, 게시판까지 하나로. 설치 없이 바로 쓰는 올인원 유틸리티 웹앱.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://generalist-phi.vercel.app">
  <meta property="og:image" content="https://generalist-phi.vercel.app/icons/icon-512.svg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Generalist - 올인원 유틸리티 앱">
  <meta name="twitter:description" content="날씨, 환율, AI 채팅, 번역, 여행 정보, 게시판까지 하나로.">
  <meta name="twitter:image" content="https://generalist-phi.vercel.app/icons/icon-512.svg">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #e0e0e0;
      height: 100dvh;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    @supports (height: 100dvh) {
      body { height: 100dvh; }
    }

    /* ── Phone Frame (PC) ──  */
    .app {
      width: 100%;
      height: 92vh;
      max-height: 860px;
      background: #f5f5f5;
      border-radius: 28px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (max-width: 1600px) {
      body { background: #f5f5f5; }
      .app {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* ── Header ── */
    .header {
      background: #111;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header .logo {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    .header .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-right {
      display: flex;
      gap: 6px;
    }

    .noti-btn-wrap {
      position: relative;
    }

    .noti-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #f43f5e;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .header-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .header-btn:hover { background: rgba(255,255,255,0.2); }

    /* ── Content Area ── */
    .content-area {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .content-area iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .content-area iframe.active { display: block; }

    /* ── Home Page ── */
    .home-page {
      padding: 20px;
      height: 100%;
      overflow-y: auto;
    }

    .hidden { display: none !important; }
    .home-page.hidden { display: none; }

    .greeting {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #111;
    }

    .greeting-sub {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .app-scroll {
      display: flex;
      gap: 0;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .app-scroll::-webkit-scrollbar { display: none; }

    .scroll-bar-wrap {
      width: 100%;
      height: 4px;
      background: #e8e8e8;
      border-radius: 2px;
      margin: 4px 0 0;
      position: relative;
      overflow: hidden;
    }

    .scroll-bar-drag {
      height: 100%;
      background: #6366f1;
      border-radius: 2px;
      position: absolute;
      left: 0;
    }

    .app-scroll .app-icon {
      scroll-snap-align: start;
      flex-shrink: 0;
      width: calc(100% / 4.5);
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .app-icon .icon-box {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: transform 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .app-icon:active .icon-box { transform: scale(0.9); }

    .app-icon .icon-label {
      font-size: 11px;
      color: #555;
      text-align: center;
      line-height: 1.2;
    }

    /* ── Home Post List ── */
    .home-section {
      margin-top: 24px;
    }

    .home-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .home-section-more {
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      border: none;
      background: none;
    }

    .home-post-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .home-post-item {
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      transition: box-shadow 0.15s;
    }

    .home-post-item:active { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

    .home-post-title {
      font-size: 14px;
      font-weight: 600;
      color: #111;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .home-post-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #aaa;
    }

    .home-post-meta span {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* ── Bottom Nav ── */
    .bottom-nav {
      background: #fff;
      border-top: 1px solid #e8e8e8;
      display: flex;
      flex-shrink: 0;
      padding: 6px 0;
      padding-bottom: 10px;
      z-index: 10;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 0;
      cursor: pointer;
      border: none;
      background: none;
      color: #aaa;
      font-size: 10px;
      transition: color 0.2s;
    }

    .nav-item .nav-icon { font-size: 20px; line-height: 1; }
    .nav-item.active { color: #111; }
    .nav-item:not(.active):hover { color: #666; }

    /* ── Slide Menu ── */
    .menu-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .menu-overlay.open {
      pointer-events: auto;
      opacity: 1;
    }

    .menu-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
    }

    .menu-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 80%;
      max-width: 320px;
      height: 100%;
      background: #fff;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .menu-overlay.open .menu-panel { transform: translateX(0); }

    .menu-header {
      background: #111;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-header-info {
      flex: 1;
    }

    .menu-header .name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .menu-header .email {
      font-size: 12px;
      color: #999;
    }

    .menu-section {
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .menu-section-title {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 24px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 24px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      transition: background 0.15s;
    }

    .menu-item:hover { background: #f5f5f5; }
    .menu-item .mi-icon { font-size: 18px; width: 24px; text-align: center; opacity: 0.6; }

    .menu-close {
      width: 32px;
      height: 32px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── Admin Stats ── */
    .admin-stats {
      padding: 16px 24px;
      background: #f8f8f8;
      border-top: 1px solid #eee;
      margin-top: auto;
    }

    .admin-stats-title {
      font-size: 10px;
      font-weight: 700;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .admin-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .admin-stats-row .label {
      font-size: 12px;
      color: #888;
    }

    .admin-stats-row .value {
      font-size: 13px;
      font-weight: 700;
      color: #333;
    }

    /* ── Splash Screen ── */
    .splash {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s;
    }

    .splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 16px;
      animation: splash-pop 0.5s ease-out;
    }

    .splash-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
      animation: splash-pop 0.5s ease-out 0.1s both;
    }

    @keyframes splash-pop {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ── Scrollbar ── */
    .home-page::-webkit-scrollbar { width: 4px; }
    .home-page::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
  </style>
</head>

<div class="app">

    <!-- iframe (sub pages load here) -->

  <!-- Bottom Navigation -->

</div>

<script>
  const homePage = document.getElementById('homePage');
  const pageFrame = document.getElementById('pageFrame');
  let currentNav = 'home';
  let sb = null;
  const ADMIN_EMAIL = 'rak0418@naver.com';

  // ── Supabase 초기화 ──
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        const name = session.user.user_metadata?.nickname || session.user.email.split('@')[0];
        document.getElementById('menuName').textContent = name;
        document.getElementById('menuEmail').textContent = session.user.email;
        setAuthBtn(true);
        document.getElementById('menuLogoutSection').style.display = 'block';
        if (session.user.email === ADMIN_EMAIL) {
          document.getElementById('adminStats').classList.remove('hidden');
          loadAdminStats();
        }
        loadNotiBadge();
        subscribeToNotifications(session.user.id);
      }
    });
    recordVisit();
  } catch (err) {
    console.error('Supabase 초기화 실패:', err);
  }

  // ── 접속 기록 ──
  async function recordVisit() {
    if (!sb) return;
    try {
      await sb.from('visits').insert({ visited_at: new Date().toISOString() });
    } catch {}
  }

  // ── 홈 게시글 로드 ──
  async function loadHomePosts() {
    if (!sb) return;
    try {
      // 인기 게시글 (좋아요 많은 순)
      const { data: likeData } = await sb
        .from('likes')
        .select('post_id');

      const likeCounts = {};
      if (likeData) {
        likeData.forEach(l => {
          likeCounts[l.post_id] = (likeCounts[l.post_id] || 0) + 1;
        });
      }

      const { data: allPosts } = await sb
        .from('posts')
        .select('id, title, created_at, views')
        .order('created_at', { ascending: false })
        .limit(50);

      if (allPosts && allPosts.length > 0) {
        // 인기글: 좋아요 순 정렬
        const popular = [...allPosts]
          .map(p => ({ ...p, likes: likeCounts[p.id] || 0 }))
          .filter(p => p.likes > 0)
          .sort((a, b) => b.likes - a.likes)
          .slice(0, 3);

        const popEl = document.getElementById('popularPosts');
        if (popular.length > 0) {
          popEl.innerHTML = popular.map(p => renderHomePost(p, p.likes)).join('');
        } else {
          popEl.innerHTML = '<p style="font-size:13px;color:#ccc;text-align:center;padding:12px;">아직 인기 게시글이 없습니다</p>';
        }

        // 최근글
        const recent = allPosts.slice(0, 5);
        const recEl = document.getElementById('recentPosts');
        recEl.innerHTML = recent.map(p => renderHomePost(p, likeCounts[p.id] || 0)).join('');
      } else {
        document.getElementById('popularPosts').innerHTML = '<p style="font-size:13px;color:#ccc;text-align:center;padding:12px;">게시글이 없습니다</p>';
        document.getElementById('recentPosts').innerHTML = '<p style="font-size:13px;color:#ccc;text-align:center;padding:12px;">게시글이 없습니다</p>';
      }
    } catch {}
  }

  function renderHomePost(p, likes) {
    const time = formatHomeTime(p.created_at);
    return `
      <div class="home-post-item" onclick="loadPage('board/board.html?post=${p.id}','board')">
        <p class="home-post-title">${escapeHomeHtml(p.title)}</p>
        <div class="home-post-meta">
          <span>${time}</span>
          <span>&#128065; ${p.views || 0}</span>
          <span>&#9825; ${likes}</span>
        </div>
      </div>`;
  }

  function formatHomeTime(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return '방금 전';
    if (diff < 3600000) return Math.floor(diff / 60000) + '분 전';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '시간 전';
    if (diff < 172800000) return '어제';
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  function escapeHomeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  loadHomePosts();

  // ── 스크롤바 ──
  (function() {
    const scroll = document.getElementById('appScroll');
    const wrap = document.getElementById('scrollBarWrap');
    const drag = document.getElementById('scrollBarDrag');
    const maxScroll = scroll.scrollWidth - scroll.clientWidth;

    if (maxScroll <= 0) { wrap.style.display = 'none'; return; }

    const ratio = scroll.clientWidth / scroll.scrollWidth;
    drag.style.width = (ratio * 100) + '%';

    scroll.addEventListener('scroll', function() {
      const scrollRatio = scroll.scrollLeft / maxScroll;
      const maxLeft = wrap.clientWidth - drag.clientWidth;
      drag.style.left = (scrollRatio * maxLeft) + 'px';
    });
  })();

  // ── 관리자 통계 ──
  async function loadAdminStats() {
    if (!sb) return;
    try {
      // 오늘 접속자수
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const { count: todayCount } = await sb
        .from('visits')
        .select('*', { count: 'exact', head: true })
        .gte('visited_at', today.toISOString());
      document.getElementById('statToday').textContent = (todayCount || 0).toLocaleString();

      // 누적 접속자수
      const { count: totalCount } = await sb
        .from('visits')
        .select('*', { count: 'exact', head: true });
      document.getElementById('statTotal').textContent = (totalCount || 0).toLocaleString();

      // 총 회원수
      const { count: userCount } = await sb
        .from('profiles')
        .select('*', { count: 'exact', head: true });
      document.getElementById('statUsers').textContent = (userCount || 0).toLocaleString();
    } catch {}
  }

  // ── 알림 뱃지 ──
  async function loadNotiBadge() {
    if (!sb) return;
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session?.user) return;

      document.getElementById('notiBtnWrap').style.display = 'block';

      const { count } = await sb
        .from('notifications')
        .select('*', { count: 'exact', head: true })
        .eq('user_id', session.user.id)
        .eq('is_read', false);

      const badge = document.getElementById('notiBadge');
      if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count;
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    } catch {}
  }

  // ── 알림 실시간 구독 ──
  function subscribeToNotifications(userId) {
    sb.channel('noti-' + userId)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'notifications',
        filter: `user_id=eq.${userId}`
      }, () => {
        loadNotiBadge();
      })
      .subscribe();
  }

  // ── Load sub-page in iframe ──
  function loadPage(url, nav) {
    homePage.classList.add('hidden');
    pageFrame.classList.add('active');
    pageFrame.src = url;
    setActiveNav(nav);
  }

  // ── Go back to home ──
  function goHome() {
    pageFrame.classList.remove('active');
    pageFrame.src = '';
    homePage.classList.remove('hidden');
    homePage.scrollTop = 0;
    setActiveNav('');
  }

  // ── Highlight active nav button ──
  function setActiveNav(nav) {
    currentNav = nav;
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.nav === nav);
    });
  }

  // ── Slide Menu ──
  function openMenu() {
    document.getElementById('menuOverlay').classList.add('open');
  }

  function closeMenu() {
    document.getElementById('menuOverlay').classList.remove('open');
  }

  // ── Auth state from iframe ──
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'auth-state-change') {
      const user = e.data.user;
      if (user) {
        const name = user.nickname || user.email.split('@')[0];
        document.getElementById('menuName').textContent = name;
        document.getElementById('menuEmail').textContent = user.email;
        setAuthBtn(true);
        document.getElementById('menuLogoutSection').style.display = 'block';
        if (user.email === ADMIN_EMAIL) {
          document.getElementById('adminStats').classList.remove('hidden');
          loadAdminStats();
        } else {
          document.getElementById('adminStats').classList.add('hidden');
        }
        loadNotiBadge();
        if (e.data.action === 'login') goHome();
      } else {
        document.getElementById('menuName').textContent = '게스트';
        document.getElementById('menuEmail').textContent = '로그인해주세요';
        setAuthBtn(false);
        document.getElementById('menuLogoutSection').style.display = 'none';
        document.getElementById('adminStats').classList.add('hidden');
        document.getElementById('notiBtnWrap').style.display = 'none';
      }
    }
    if (e.data && e.data.type === 'go-to-auth') {
      loadPage('auth/auth.html', 'auth');
    }
    if (e.data && e.data.type === 'noti-read') {
      loadNotiBadge();
    }
  });

  // ── Auth button toggle ──
  function setAuthBtn(loggedIn) {
    const btn = document.getElementById('authBtn');
    if (loggedIn) {
      btn.textContent = '로그아웃';
      btn.onclick = handleLogout;
    } else {
      btn.textContent = '로그인';
      btn.onclick = function() { loadPage('auth/auth.html', 'auth'); };
    }
  }

  // ── Logout ──
  async function handleLogout() {
    if (sb) {
      await sb.auth.signOut({ scope: 'local' });
      localStorage.clear();
    }
    document.getElementById('menuName').textContent = '게스트';
    document.getElementById('menuEmail').textContent = '로그인해주세요';
    setAuthBtn(false);
    document.getElementById('menuLogoutSection').style.display = 'none';
    document.getElementById('adminStats').classList.add('hidden');
    document.getElementById('notiBtnWrap').style.display = 'none';
    goHome();
  }

  // ── Splash Screen (iOS만, Android는 manifest 스플래시 사용) ──
  const isAndroidPWA = /Android/i.test(navigator.userAgent) && window.matchMedia('(display-mode: standalone)').matches;
  if (isAndroidPWA) {
    const splash = document.getElementById('splash');
    if (splash) splash.remove();
  } else {
    setTimeout(() => {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 400);
      }
    }, 1200);
  }

  // ── Service Worker ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
