<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Generalist</title>
  <meta name="description" content="All-in-one utility app">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #e0e0e0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ── Phone Frame (PC) ──  */
    .app {
      width: 100%;
      height: 92vh;
      max-height: 860px;
      background: #f5f5f5;
      border-radius: 28px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (max-width: 1600px) {
      body { background: #f5f5f5; }
      .app {
        width: 100%;
        height: 100vh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* ── Header ── */
    .header {
      background: #111;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header .logo {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    .header .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-right {
      display: flex;
      gap: 6px;
    }

    .header-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .header-btn:hover { background: rgba(255,255,255,0.2); }

    /* ── Content Area ── */
    .content-area {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .content-area iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .content-area iframe.active { display: block; }

    /* ── Home Page ── */
    .home-page {
      padding: 20px;
      height: 100%;
      overflow-y: auto;
    }

    .home-page.hidden { display: none; }

    .greeting {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #111;
    }

    .greeting-sub {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .app-icon .icon-box {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: transform 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .app-icon:active .icon-box { transform: scale(0.9); }

    .app-icon .icon-label {
      font-size: 11px;
      color: #555;
      text-align: center;
      line-height: 1.2;
    }

    /* ── Bottom Nav ── */
    .bottom-nav {
      background: #fff;
      border-top: 1px solid #e8e8e8;
      display: flex;
      flex-shrink: 0;
      padding: 6px 0;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 10;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 0;
      cursor: pointer;
      border: none;
      background: none;
      color: #aaa;
      font-size: 10px;
      transition: color 0.2s;
    }

    .nav-item .nav-icon { font-size: 20px; line-height: 1; }
    .nav-item.active { color: #111; }
    .nav-item:not(.active):hover { color: #666; }

    /* ── Slide Menu ── */
    .menu-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .menu-overlay.open {
      pointer-events: auto;
      opacity: 1;
    }

    .menu-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
    }

    .menu-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 80%;
      max-width: 320px;
      height: 100%;
      background: #fff;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .menu-overlay.open .menu-panel { transform: translateX(0); }

    .menu-header {
      background: #111;
      color: #fff;
      padding: 28px 24px;
    }

    .menu-header .name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .menu-header .email {
      font-size: 12px;
      color: #999;
    }

    .menu-section {
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .menu-section-title {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 24px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 24px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      transition: background 0.15s;
    }

    .menu-item:hover { background: #f5f5f5; }
    .menu-item .mi-icon { font-size: 18px; width: 24px; text-align: center; opacity: 0.6; }

    .menu-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Admin Stats ── */
    .admin-stats {
      padding: 16px 24px;
      background: #f8f8f8;
      border-top: 1px solid #eee;
      margin-top: auto;
    }

    .admin-stats-title {
      font-size: 10px;
      font-weight: 700;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .admin-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .admin-stats-row .label {
      font-size: 12px;
      color: #888;
    }

    .admin-stats-row .value {
      font-size: 13px;
      font-weight: 700;
      color: #333;
    }

    /* ── Scrollbar ── */
    .home-page::-webkit-scrollbar { width: 4px; }
    .home-page::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">G</div>
      <span class="title">Generalist</span>
    </div>
    <div class="header-right">
      <button class="header-btn" id="authBtn" onclick="loadPage('auth/auth.html','auth')" title="로그인" style="font-size:12px;width:auto;padding:0 10px;">로그인</button>
      <button class="header-btn" onclick="openMenu()" title="메뉴">&#9776;</button>
    </div>
  </div>

  <!-- Content Area -->
  <div class="content-area">

    <!-- Home (inline) -->
    <div class="home-page" id="homePage">

      <p class="section-title">Fun</p>
      <div class="app-grid">
        <div class="app-icon" onclick="loadPage('fun/lotto.html','fun')">
          <div class="icon-box" style="background:linear-gradient(135deg,#10b981,#059669);color:#fff;">&#127922;</div>
          <span class="icon-label">로또</span>
        </div>
      </div>

      <p class="section-title">Community</p>
      <div class="app-grid">
        <div class="app-icon" onclick="loadPage('board/board.html','board')">
          <div class="icon-box" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;">&#128221;</div>
          <span class="icon-label">게시판</span>
        </div>
      </div>

      <p class="section-title">Utility</p>
      <div class="app-grid">
        <div class="app-icon" onclick="loadPage('travel/world_travel_map.html','worldmap')">
          <div class="icon-box" style="background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#fff;">🌍</div>
          <span class="icon-label">여행정보</span>
        </div>
        <div class="app-icon" onclick="loadPage('travel/travel_planner.html','travel')">
          <div class="icon-box" style="background:linear-gradient(135deg,#14b8a6,#10b981);color:#fff;">✈️</div>
          <span class="icon-label">여행계획</span>
        </div>
        <div class="app-icon" onclick="loadPage('chat/ai_chatbot.html','chat')">
          <div class="icon-box" style="background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;">💬</div>
          <span class="icon-label">AI 채팅</span>
        </div>
        <div class="app-icon" onclick="loadPage('translator/translator.html','util')">
          <div class="icon-box" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;">&#127760;</div>
          <span class="icon-label">번역기</span>
        </div>
        <div class="app-icon" onclick="loadPage('currency/currency.html','currency')">
          <div class="icon-box" style="background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff;">&#128178;</div>
          <span class="icon-label">환율</span>
        </div>
        <div class="app-icon" onclick="loadPage('weather/weather.html','weather')">
          <div class="icon-box" style="background:linear-gradient(135deg,#0ea5e9,#3b82f6);color:#fff;">&#9925;</div>
          <span class="icon-label">날씨</span>
        </div>
      </div>
    </div>

    <!-- iframe (sub pages load here) -->
    <iframe id="pageFrame"></iframe>

  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <button class="nav-item active" data-nav="home" onclick="goHome()">
      <span class="nav-icon">&#127968;</span>
      <span>홈</span>
    </button>
    <button class="nav-item" data-nav="worldmap" onclick="loadPage('travel/world_travel_map.html','worldmap')">
      <span class="nav-icon">&#127758;</span>
      <span>여행정보</span>
    </button>    
    <button class="nav-item" data-nav="travel" onclick="loadPage('travel/travel_planner.html','travel')">
      <span class="nav-icon">&#9992;&#65039;</span>
      <span>여행계획</span>
    </button>
    <button class="nav-item" data-nav="chat" onclick="loadPage('chat/ai_chatbot.html','chat')">
      <span class="nav-icon">&#128172;</span>
      <span>AI 채팅</span>
    </button>
    <button class="nav-item" data-nav="board" onclick="loadPage('board/board.html','board')">
      <span class="nav-icon">&#128221;</span>
      <span>게시판</span>
    </button>
  </div>


  <!-- Slide Menu -->
  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-backdrop" onclick="closeMenu()"></div>
    <div class="menu-panel">
      <div class="menu-header">
        <button class="menu-close" onclick="closeMenu()">&#10005;</button>
        <p class="name" id="menuName">게스트</p>
        <p class="email" id="menuEmail">로그인해주세요</p>
      </div>

      <div class="menu-section">
        <p class="menu-section-title">Info</p>
        <div class="menu-item" onclick="closeMenu();">
          <span class="mi-icon">&#128227;</span> 공지사항
        </div>
        <div class="menu-item" onclick="closeMenu();">
          <span class="mi-icon">&#128276;</span> 알림
        </div>
        <div class="menu-item" onclick="closeMenu();">
          <span class="mi-icon">&#127381;</span> 업데이트
        </div>
      </div>

      <div class="menu-section">
        <p class="menu-section-title">Support</p>
        <div class="menu-item" onclick="closeMenu();">
          <span class="mi-icon">&#128172;</span> 문의하기
        </div>
        <div class="menu-item" onclick="closeMenu();">
          <span class="mi-icon">&#10067;</span> 도움말
        </div>
        <div class="menu-item" onclick="closeMenu(); loadPage('legal/terms.html','legal');">
          <span class="mi-icon">&#128196;</span> 이용약관
        </div>
        <div class="menu-item" onclick="closeMenu(); loadPage('legal/privacy.html','legal');">
          <span class="mi-icon">&#128274;</span> 개인정보처리방침
        </div>
      </div>

      <div class="menu-section">
        <div class="menu-item" onclick="closeMenu();">
          <span class="mi-icon">&#128712;</span> 앱 정보
        </div>
      </div>

      <div class="menu-section" id="menuLogoutSection" style="display:none;">
        <div class="menu-item" onclick="closeMenu(); loadPage('auth/auth.html','auth');">
          <span class="mi-icon">&#128100;</span> 내정보
        </div>
      </div>

      <div class="admin-stats hidden" id="adminStats">
        <p class="admin-stats-title">Admin</p>
        <div class="admin-stats-row">
          <span class="label">오늘 접속자</span>
          <span class="value" id="statToday">-</span>
        </div>
        <div class="admin-stats-row">
          <span class="label">누적 접속자</span>
          <span class="value" id="statTotal">-</span>
        </div>
        <div class="admin-stats-row">
          <span class="label">총 회원수</span>
          <span class="value" id="statUsers">-</span>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  const homePage = document.getElementById('homePage');
  const pageFrame = document.getElementById('pageFrame');
  let currentNav = 'home';
  let sb = null;
  const ADMIN_EMAIL = 'rak0418@naver.com';

  // ── Supabase 초기화 ──
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        const name = session.user.user_metadata?.nickname || session.user.email.split('@')[0];
        document.getElementById('menuName').textContent = name;
        document.getElementById('menuEmail').textContent = session.user.email;
        setAuthBtn(true);
        document.getElementById('menuLogoutSection').style.display = 'block';
        if (session.user.email === ADMIN_EMAIL) {
          document.getElementById('adminStats').classList.remove('hidden');
          loadAdminStats();
        }
      }
    });
    recordVisit();
  } catch (err) {
    console.error('Supabase 초기화 실패:', err);
  }

  // ── 접속 기록 ──
  async function recordVisit() {
    if (!sb) return;
    try {
      await sb.from('visits').insert({ visited_at: new Date().toISOString() });
    } catch {}
  }

  // ── 관리자 통계 ──
  async function loadAdminStats() {
    if (!sb) return;
    try {
      // 오늘 접속자수
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const { count: todayCount } = await sb
        .from('visits')
        .select('*', { count: 'exact', head: true })
        .gte('visited_at', today.toISOString());
      document.getElementById('statToday').textContent = (todayCount || 0).toLocaleString();

      // 누적 접속자수
      const { count: totalCount } = await sb
        .from('visits')
        .select('*', { count: 'exact', head: true });
      document.getElementById('statTotal').textContent = (totalCount || 0).toLocaleString();

      // 총 회원수
      const { count: userCount } = await sb
        .from('profiles')
        .select('*', { count: 'exact', head: true });
      document.getElementById('statUsers').textContent = (userCount || 0).toLocaleString();
    } catch {}
  }

  // ── Load sub-page in iframe ──
  function loadPage(url, nav) {
    homePage.classList.add('hidden');
    pageFrame.classList.add('active');
    pageFrame.src = url;
    setActiveNav(nav);
  }

  // ── Go back to home ──
  function goHome() {
    pageFrame.classList.remove('active');
    pageFrame.src = '';
    homePage.classList.remove('hidden');
    homePage.scrollTop = 0;
    setActiveNav('home');
  }

  // ── Highlight active nav button ──
  function setActiveNav(nav) {
    currentNav = nav;
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.nav === nav);
    });
  }

  // ── Slide Menu ──
  function openMenu() {
    document.getElementById('menuOverlay').classList.add('open');
  }

  function closeMenu() {
    document.getElementById('menuOverlay').classList.remove('open');
  }

  // ── Auth state from iframe ──
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'auth-state-change') {
      const user = e.data.user;
      if (user) {
        const name = user.nickname || user.email.split('@')[0];
        document.getElementById('menuName').textContent = name;
        document.getElementById('menuEmail').textContent = user.email;
        setAuthBtn(true);
        document.getElementById('menuLogoutSection').style.display = 'block';
        if (user.email === ADMIN_EMAIL) {
          document.getElementById('adminStats').classList.remove('hidden');
          loadAdminStats();
        } else {
          document.getElementById('adminStats').classList.add('hidden');
        }
        if (e.data.action === 'login') goHome();
      } else {
        document.getElementById('menuName').textContent = '게스트';
        document.getElementById('menuEmail').textContent = '로그인해주세요';
        setAuthBtn(false);
        document.getElementById('menuLogoutSection').style.display = 'none';
        document.getElementById('adminStats').classList.add('hidden');
      }
    }
    if (e.data && e.data.type === 'go-to-auth') {
      loadPage('auth/auth.html', 'auth');
    }
  });

  // ── Auth button toggle ──
  function setAuthBtn(loggedIn) {
    const btn = document.getElementById('authBtn');
    if (loggedIn) {
      btn.textContent = '로그아웃';
      btn.onclick = handleLogout;
    } else {
      btn.textContent = '로그인';
      btn.onclick = function() { loadPage('auth/auth.html', 'auth'); };
    }
  }

  // ── Logout ──
  async function handleLogout() {
    if (sb) {
      await sb.auth.signOut({ scope: 'local' });
      localStorage.clear();
    }
    document.getElementById('menuName').textContent = '게스트';
    document.getElementById('menuEmail').textContent = '로그인해주세요';
    setAuthBtn(false);
    document.getElementById('menuLogoutSection').style.display = 'none';
    document.getElementById('adminStats').classList.add('hidden');
    goHome();
  }

  // ── Service Worker ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
