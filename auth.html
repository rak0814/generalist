<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 / 회원가입</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 400px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-header .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
    }

    .auth-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .auth-header p {
      font-size: 13px;
      color: #888;
    }

    .auth-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .tab-bar {
      display: flex;
      background: #f0f0f0;
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #fff;
      color: #111;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background: #fafafa;
    }

    .form-group input:focus {
      border-color: #6366f1;
      background: #fff;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .link-btn {
      background: none;
      border: none;
      color: #6366f1;
      font-size: 13px;
      cursor: pointer;
      margin-top: 12px;
      display: block;
      text-align: center;
      width: 100%;
    }

    .link-btn:hover { text-decoration: underline; }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    /* Profile card */
    .profile-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      text-align: center;
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      margin-bottom: 16px;
    }

    .profile-nickname {
      font-size: 18px;
      font-weight: 700;
      color: #111;
      margin-bottom: 2px;
    }

    .profile-email {
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
      word-break: break-all;
    }

    .profile-date {
      font-size: 12px;
      color: #bbb;
      margin-bottom: 24px;
    }

    .profile-edit-section {
      text-align: left;
      border-top: 1px solid #eee;
      padding-top: 20px;
      margin-top: 4px;
    }

    .profile-edit-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .profile-edit-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .profile-edit-row button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      height: 44px;
    }

    .profile-msg {
      font-size: 12px;
      margin-top: 8px;
      color: #059669;
      display: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-header">
    <div class="logo">G</div>
    <h1>Generalist</h1>
    <p id="authSubtitle">이메일로 간편하게 시작하세요</p>
  </div>

  <!-- Login / Signup Form -->
  <div class="auth-card" id="authCard">
    <div class="tab-bar" id="tabBar">
      <button type="button" class="tab-btn active" id="tabLogin" onclick="switchTab('login')">로그인</button>
      <button type="button" class="tab-btn" id="tabSignup" onclick="switchTab('signup')">회원가입</button>
    </div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="form-group" id="nicknameGroup" style="display:none;">
        <label>닉네임</label>
        <input type="text" id="nickname" placeholder="닉네임을 입력하세요" autocomplete="name">
      </div>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="email" placeholder="example@email.com" required autocomplete="email">
      </div>
      <div class="form-group" id="passwordGroup">
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="6자 이상 입력하세요" required minlength="6" autocomplete="current-password">
      </div>
      <div class="form-group hidden" id="confirmGroup">
        <label>비밀번호 확인</label>
        <input type="password" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password">
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">로그인</button>
    </form>

    <button type="button" class="link-btn" id="forgotBtn" onclick="switchTab('forgot')">비밀번호를 잊으셨나요?</button>

    <div class="message" id="message"></div>
  </div>

  <!-- Profile (logged-in) -->
  <div class="profile-card hidden" id="profileCard">
    <div class="profile-avatar" id="profileAvatar">&#128100;</div>
    <p class="profile-nickname" id="profileNickname"></p>
    <p class="profile-email" id="profileEmail"></p>
    <p class="profile-date" id="profileDate"></p>

    <div class="profile-edit-section">
      <div class="profile-edit-row">
        <div class="form-group">
          <label>닉네임 변경</label>
          <input type="text" id="editNickname" placeholder="새 닉네임">
        </div>
        <button onclick="updateNickname()">변경</button>
      </div>
      <p class="profile-msg" id="profileMsg"></p>
    </div>
  </div>
</div>

<script>
  let currentTab = 'login';
  let sb = null;

  // ── UI 함수 ──
  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('authForm').reset();
    hideMessage();

    if (tab === 'forgot') {
      document.getElementById('tabBar').style.display = 'none';
      document.getElementById('passwordGroup').style.display = 'none';
      document.getElementById('confirmGroup').classList.add('hidden');
      document.getElementById('nicknameGroup').style.display = 'none';
      document.getElementById('submitBtn').textContent = '비밀번호 재설정 메일 보내기';
      document.getElementById('forgotBtn').textContent = '로그인으로 돌아가기';
      document.getElementById('forgotBtn').onclick = function() { switchTab('login'); };
      document.getElementById('password').removeAttribute('required');
      document.getElementById('authSubtitle').textContent = '가입한 이메일을 입력하세요';
    } else {
      document.getElementById('tabBar').style.display = 'flex';
      document.getElementById('passwordGroup').style.display = 'block';
      document.getElementById('password').setAttribute('required', '');
      document.getElementById('forgotBtn').textContent = '비밀번호를 잊으셨나요?';
      document.getElementById('forgotBtn').onclick = function() { switchTab('forgot'); };
      document.getElementById('forgotBtn').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('authSubtitle').textContent = '이메일로 간편하게 시작하세요';

      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
      document.getElementById('confirmGroup').classList.toggle('hidden', tab === 'login');
      document.getElementById('nicknameGroup').style.display = tab === 'signup' ? 'block' : 'none';
      document.getElementById('submitBtn').textContent = tab === 'login' ? '로그인' : '회원가입';
    }
  }

  function showMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = 'message ' + type;
    el.style.display = 'block';
  }

  function hideMessage() {
    const el = document.getElementById('message');
    el.className = 'message';
    el.style.display = 'none';
  }

  function showLoggedIn(user) {
    document.getElementById('authCard').classList.add('hidden');
    document.getElementById('profileCard').classList.remove('hidden');

    const nickname = user.user_metadata?.nickname || user.email.split('@')[0];
    document.getElementById('profileAvatar').textContent = nickname.charAt(0).toUpperCase();
    document.getElementById('profileNickname').textContent = nickname;
    document.getElementById('profileEmail').textContent = user.email;
    document.getElementById('editNickname').value = nickname;

    const created = new Date(user.created_at);
    document.getElementById('profileDate').textContent =
      '가입일: ' + created.getFullYear() + '.' + (created.getMonth()+1) + '.' + created.getDate();
  }

  function notifyParent(user, action) {
    if (window.parent !== window) {
      window.parent.postMessage({
        type: 'auth-state-change',
        action: action || 'init',
        user: user ? { email: user.email, id: user.id, nickname: user.user_metadata?.nickname } : null
      }, '*');
    }
  }

  // ── Form submit ──
  async function handleSubmit(e) {
    e.preventDefault();
    if (!sb) { showMessage('서버 연결 중입니다. 잠시 후 다시 시도하세요.', 'error'); return; }

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    try {
      if (currentTab === 'forgot') {
        const { error } = await sb.auth.resetPasswordForEmail(email);
        if (error) {
          showMessage(error.message, 'error');
        } else {
          showMessage('비밀번호 재설정 메일을 보냈습니다. 이메일을 확인하세요.', 'success');
        }
      } else if (currentTab === 'signup') {
        const confirm = document.getElementById('confirmPassword').value;
        if (password !== confirm) {
          showMessage('비밀번호가 일치하지 않습니다.', 'error');
          btn.disabled = false;
          return;
        }

        const nickname = document.getElementById('nickname').value.trim() || email.split('@')[0];

        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: { data: { nickname } }
        });

        if (error) {
          showMessage(error.message, 'error');
        } else if (data.user && data.user.identities && data.user.identities.length === 0) {
          showMessage('이미 가입된 이메일입니다.', 'error');
        } else if (data.session) {
          showLoggedIn(data.user);
          notifyParent(data.user, 'login');
        } else {
          showMessage('회원가입 완료! 로그인해주세요.', 'success');
        }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          showMessage('이메일 또는 비밀번호가 올바르지 않습니다.', 'error');
        } else {
          showLoggedIn(data.user);
          notifyParent(data.user, 'login');
        }
      }
    } catch (err) {
      showMessage('오류가 발생했습니다: ' + err.message, 'error');
    }

    btn.disabled = false;
  }

  // ── Nickname update ──
  async function updateNickname() {
    if (!sb) return;
    const newNickname = document.getElementById('editNickname').value.trim();
    if (!newNickname) return alert('닉네임을 입력하세요.');

    const { data, error } = await sb.auth.updateUser({
      data: { nickname: newNickname }
    });

    const msg = document.getElementById('profileMsg');
    if (error) {
      msg.textContent = '변경 실패: ' + error.message;
      msg.style.color = '#dc2626';
    } else {
      msg.textContent = '닉네임이 변경되었습니다.';
      msg.style.color = '#059669';
      document.getElementById('profileNickname').textContent = newNickname;
      document.getElementById('profileAvatar').textContent = newNickname.charAt(0).toUpperCase();
      notifyParent(data.user, 'login');
    }
    msg.style.display = 'block';
  }

  async function handleLogout() {
    if (!sb) return;
    await sb.auth.signOut();
    document.getElementById('profileCard').classList.add('hidden');
    document.getElementById('authCard').classList.remove('hidden');
    notifyParent(null);
  }

  // ── Supabase 초기화 ──
  async function init() {
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) {
        showLoggedIn(session.user);
        notifyParent(session.user);
      }
    } catch (err) {
      console.error('Supabase 초기화 실패:', err);
    }
  }

  init();
</script>

</body>
</html>
